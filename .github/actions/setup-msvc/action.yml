name: Required MSVC toolchain
description: Verify or provision the repository's required MSVC family on a hosted Windows runner.
inputs:
  platform:
    description: Native target architecture
    default: x64
runs:
  using: composite
  steps:
    - id: engine
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $project = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE '.ci/project.json') -Raw | ConvertFrom-Json
        if ($project.engine.repository -cne 'RedSalamanders/.github' -or $project.engine.ref -cnotmatch '^[a-f0-9]{40}$') {
          throw 'Invalid shared CI engine pin in .ci/project.json.'
        }
        "ref=$($project.engine.ref)" >> $env:GITHUB_OUTPUT
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: RedSalamanders/.github
        ref: ${{ steps.engine.outputs.ref }}
        path: .ci-engine
        persist-credentials: false
    - id: prepare
      shell: pwsh
      env:
        MSVC_SETUP_PLATFORM: ${{ inputs.platform }}
      run: '& "$env:GITHUB_ACTION_PATH/Setup.ps1" -Platform $env:MSVC_SETUP_PLATFORM'
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() && steps.prepare.outcome == 'failure' && steps.prepare.outputs.installer_logs != '' }}
      with:
        name: ${{ steps.prepare.outputs.artifact_id }}
        path: ${{ steps.prepare.outputs.installer_logs }}/*.log
        if-no-files-found: warn
        retention-days: 14