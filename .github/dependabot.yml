version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
    open-pull-requests-limit: 5
    ignore:
      # Engine pin updates also change .ci/project.json and all thin callers together.
      - dependency-name: RedSalamanders/.github
    exclude-paths:
      - .github/workflows/terminal-engine-gate0.yml
      - .github/workflows/terminal-engine-round4-closeout.yml
  - package-ecosystem: vcpkg
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
    open-pull-requests-limit: 5
    ignore:
      # Port floors, baseline and executable pins require one audited update.
      - dependency-name: github.com/microsoft/vcpkg
      - dependency-name: aws-sdk-cpp
      - dependency-name: aws-crt-cpp
      - dependency-name: '*'
