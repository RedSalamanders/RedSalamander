version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    labels: [dependencies, github-actions]
    open-pull-requests-limit: 5

  - package-ecosystem: vcpkg
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    labels: [dependencies, vcpkg]
    open-pull-requests-limit: 5
    groups:
      core-stack:
        patterns:
          - wil
          - yyjson
    allow:
      - dependency-type: direct
