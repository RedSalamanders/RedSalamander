name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR to recheck after an explicit formatting commit
        type: string
        required: true
      expected_head:
        description: Exact new PR head SHA
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'push' && 'main-coordinator' || github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true
jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    outputs:
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
      check_id: ${{ steps.pr.outputs.check_id }}
      codeql_id: ${{ steps.pr.outputs.codeql_id }}
      dependency_id: ${{ steps.pr.outputs.dependency_id }}
    steps:
      - name: Enable long Windows checkout paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RedSalamanders/.github
          ref: 633e127f13408d294bb6bdd338bfceac721b109a
          path: .ci-engine
          persist-credentials: false
      - id: pr
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PR: ${{ inputs.pr_number }}
          CI_HEAD: ${{ inputs.expected_head }}
        run: ./.ci-engine/Tools/Resolve-PrCheck.ps1 -PullRequest $env:CI_PR -ExpectedHead $env:CI_HEAD
  checks:
    needs: resolve
    if: always() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && needs.resolve.result == 'success'))
    uses: RedSalamanders/.github/.github/workflows/pr.yml@633e127f13408d294bb6bdd338bfceac721b109a
    with:
      engine_ref: 633e127f13408d294bb6bdd338bfceac721b109a
      head: ${{ github.event.pull_request.head.sha || needs.resolve.outputs.head }}
      base: ${{ github.event.pull_request.base.sha || needs.resolve.outputs.base }}
    permissions:
      contents: read
  security-recheck:
    needs: resolve
    if: github.event_name == 'workflow_dispatch' && needs.resolve.result == 'success'
    uses: RedSalamanders/.github/.github/workflows/security.yml@633e127f13408d294bb6bdd338bfceac721b109a
    with:
      engine_ref: 633e127f13408d294bb6bdd338bfceac721b109a
      head: ${{ needs.resolve.outputs.head }}
      base: ${{ needs.resolve.outputs.base }}
      pr_number: ${{ inputs.pr_number }}
    permissions:
      contents: read
      actions: read
      security-events: write
  report:
    needs: [resolve, checks, security-recheck]
    if: always() && github.event_name == 'workflow_dispatch' && needs.resolve.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
      - name: Enable long Windows checkout paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RedSalamanders/.github
          ref: 633e127f13408d294bb6bdd338bfceac721b109a
          path: .ci-engine
          persist-credentials: false
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CHECK_ID: ${{ needs.resolve.outputs.check_id }}
          CI_RESULT: ${{ needs.checks.result }}
          CODEQL_CHECK_ID: ${{ needs.resolve.outputs.codeql_id }}
          DEPENDENCY_CHECK_ID: ${{ needs.resolve.outputs.dependency_id }}
          CODEQL_RESULT: ${{ needs.security-recheck.outputs.codeql_result || 'failure' }}
          DEPENDENCY_RESULT: ${{ needs.security-recheck.outputs.dependency_result || 'failure' }}
        run: |
          # Complete every exact-head check even when another check fails.
          $failed = $false
          foreach ($check in @(
            @{Id=$env:CI_CHECK_ID;Kind='CI';Result=$env:CI_RESULT},
            @{Id=$env:CODEQL_CHECK_ID;Kind='CodeQL';Result=$env:CODEQL_RESULT},
            @{Id=$env:DEPENDENCY_CHECK_ID;Kind='Dependency';Result=$env:DEPENDENCY_RESULT}
          )) {
            try { ./.ci-engine/Tools/Complete-PrCheck.ps1 -CheckId $check.Id -Kind $check.Kind -Result $check.Result }
            catch { Write-Host $_.Exception.Message; $failed = $true }
          }
          if ($failed) { throw 'One or more compiler-free PR rechecks failed.' }
  coordinate:
    if: github.event_name == 'push'
    uses: RedSalamanders/.github/.github/workflows/coordinate.yml@633e127f13408d294bb6bdd338bfceac721b109a
    with:
      engine_ref: 633e127f13408d294bb6bdd338bfceac721b109a
    permissions:
      contents: read
      statuses: write
      actions: write
