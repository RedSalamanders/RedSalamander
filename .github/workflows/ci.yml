name: CI

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  migration-guards:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify migrated code no longer uses comctl subclass manager
        shell: pwsh
        run: .\Tools\Verify-NoSubclassManager.ps1

      - name: Verify comctl report-surface audit
        shell: pwsh
        run: .\Tools\Audit-ComctlReportSurfaces.ps1

      - name: Verify visible native surface audit
        shell: pwsh
        run: .\Tools\Audit-VisibleNativeSurfaces.ps1

  format:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install clang-format
        shell: pwsh
        run: |
          $oldNativeErrorPreference = $PSNativeCommandUseErrorActionPreference
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            choco install llvm -y --no-progress --ignore-detected-reboot --ignore-package-exit-codes
            $exitCode = $LASTEXITCODE
          } finally {
            $PSNativeCommandUseErrorActionPreference = $oldNativeErrorPreference
          }

          if ($exitCode -notin 0,3010) { throw "LLVM install failed: $exitCode" }
          if ($exitCode -eq 3010) { Write-Warning "LLVM requested a reboot; continuing because the Chocolatey install succeeded." }
          $global:LASTEXITCODE = 0

      - name: Run format-all.ps1
        shell: pwsh
        run: .\format-all.ps1

      - name: Commit formatting fixes
        shell: pwsh
        run: |
          git diff --quiet
          if ($LASTEXITCODE -ne 0) {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: auto-format C++ sources`n`nApplied clang-format via format-all.ps1"
            git push
            Write-Host "Formatting fixes committed and pushed." -ForegroundColor Green
          } else {
            Write-Host "No formatting changes needed." -ForegroundColor Green
          }

  build:
    uses: ./.github/workflows/build-reusable.yml
    with:
      upload_build_output: false

  selftest-build:
    uses: ./.github/workflows/build-reusable.yml
    with:
      configuration: Debug
      platform: x64
      upload_build_output: true

  selftest:
    runs-on: windows-latest
    needs: selftest-build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build-output-x64
          path: .build/x64/Debug/

      - name: Stage Themes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path .\Themes) {
            $dest = Join-Path $env:GITHUB_WORKSPACE ".build\x64\Debug\Themes"
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            Copy-Item -Path .\Themes\* -Destination $dest -Recurse -Force
          }

      - name: Run Compare and FileOps selftests
        shell: pwsh
        working-directory: .build/x64/Debug
        run: .\RedSalamander.exe --compare-selftest --fileops-selftest --selftest-timeout-multiplier=2.0
        timeout-minutes: 40

      - name: Run Commands selftests
        shell: pwsh
        working-directory: .build/x64/Debug
        run: .\RedSalamander.exe --commands-selftest --selftest-timeout-multiplier=2.0
        timeout-minutes: 50

      - name: Run Viewer PETests
        shell: pwsh
        working-directory: .build/x64/Debug
        run: |
          .\ViewerPETests.exe
          .\ViewerPETests.exe TestViewerTextFindPromptUsesDxUiHostAndClosesCleanly
          .\ViewerPETests.exe TestViewerTextGotoPromptUsesDxUiHostAndClosesCleanly
        timeout-minutes: 20

      - name: Run DxUi And ViewerSqlite Tests
        shell: pwsh
        working-directory: .build/x64/Debug
        run: |
          .\DxUiTests.exe
          .\ViewerSqliteTests.exe
        timeout-minutes: 25

      - name: Run Monitor and Localization Tests
        shell: pwsh
        working-directory: .build/x64/Debug
        run: |
          .\MonitorTest.exe
          .\LocalizationTests.exe
        timeout-minutes: 15

      - name: Run PerformanceTests2
        shell: pwsh
        working-directory: .build/x64/Debug
        run: |
          $ErrorActionPreference = "Stop"
          $vstest = Get-Command vstest.console.exe -ErrorAction SilentlyContinue
          if (-not $vstest) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (-not (Test-Path $vswhere)) {
              throw "vstest.console.exe and vswhere.exe were not found."
            }
            $vstestPath =
              (& $vswhere -latest -products * -prerelease -find 'Common7\IDE\Extensions\TestPlatform\vstest.console.exe' 2>$null) |
              Select-Object -First 1
            if (-not $vstestPath -or -not (Test-Path $vstestPath)) {
              throw "vstest.console.exe was not found through vswhere."
            }
          } else {
            $vstestPath = $vstest.Source
          }
          & $vstestPath .\PerformanceTests2.dll
        timeout-minutes: 15

      - name: Run PowerShell tool tests
        shell: powershell
        run: |
          $result = Invoke-Pester .\Tools\Tests -ExcludeTag RequiresBuildToolchain -PassThru
          if ($result.FailedCount -gt 0) {
            throw "PowerShell tool tests failed: $($result.FailedCount)"
          }
        timeout-minutes: 30

      - name: Run fast vcpkg merge synthetic tests
        shell: pwsh
        run: .\Tests\vcpkg-merge-synthetic-test.ps1
        timeout-minutes: 10

      - name: Export LOCALAPPDATA
        if: always()
        shell: pwsh
        run: |
          "LOCALAPPDATA=$env:LOCALAPPDATA" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload selftest artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selftest-artifacts
          path: ${{ env.LOCALAPPDATA }}\RedSalamander\SelfTest\
          retention-days: 7
