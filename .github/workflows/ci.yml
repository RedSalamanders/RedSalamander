name: CI

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  migration-guards:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify migrated code no longer uses comctl subclass manager
        shell: pwsh
        run: .\Tools\Verify-NoSubclassManager.ps1

      - name: Verify comctl report-surface audit
        shell: pwsh
        run: .\Tools\Audit-ComctlReportSurfaces.ps1

      - name: Verify visible native surface audit
        shell: pwsh
        run: .\Tools\Audit-VisibleNativeSurfaces.ps1

  format:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect C++ changes
        id: cpp_changes
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $ErrorActionPreference = "Stop"
          $changedFiles = @(git diff --name-only "$env:BASE_SHA...HEAD")
          if ($LASTEXITCODE -ne 0) { throw "Unable to determine files changed since $env:BASE_SHA." }
          $hasCppChanges = @($changedFiles | Where-Object { $_ -match '\.(?:cpp|h)$' }).Count -gt 0
          "changed=$($hasCppChanges.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "C++ files changed: $hasCppChanges"

      - name: Install clang-format
        if: steps.cpp_changes.outputs.changed == 'true'
        shell: pwsh
        run: |
          $oldNativeErrorPreference = $PSNativeCommandUseErrorActionPreference
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            choco install llvm -y --no-progress --ignore-detected-reboot --ignore-package-exit-codes
            $exitCode = $LASTEXITCODE
          } finally {
            $PSNativeCommandUseErrorActionPreference = $oldNativeErrorPreference
          }

          if ($exitCode -notin 0,3010) { throw "LLVM install failed: $exitCode" }
          if ($exitCode -eq 3010) { Write-Warning "LLVM requested a reboot; continuing because the Chocolatey install succeeded." }
          $global:LASTEXITCODE = 0

      - name: Run format-all.ps1
        if: steps.cpp_changes.outputs.changed == 'true'
        shell: pwsh
        run: .\format-all.ps1

      - name: Commit formatting fixes
        if: steps.cpp_changes.outputs.changed == 'true'
        shell: pwsh
        run: |
          git diff --quiet
          if ($LASTEXITCODE -ne 0) {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: auto-format C++ sources`n`nApplied clang-format via format-all.ps1"
            git push
            Write-Host "Formatting fixes committed and pushed." -ForegroundColor Green
          } else {
            Write-Host "No formatting changes needed." -ForegroundColor Green
          }

  build:
    uses: ./.github/workflows/build-reusable.yml
    with:
      upload_build_output: false

  build-arm64:
    uses: ./.github/workflows/build-reusable.yml
    with:
      configuration: Debug
      platform: ARM64
      upload_build_output: false

  selftest-build:
    uses: ./.github/workflows/build-reusable.yml
    with:
      configuration: Debug
      platform: x64
      upload_build_output: true

  selftest:
    runs-on: windows-latest
    needs: selftest-build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select test-data root
        id: test-root
        shell: pwsh
        run: |
          $root = Join-Path ([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)) 'RedSalamander.Perf'
          "REDSALAMANDER_TEST_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "path=$root" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output-x64
          path: .build/x64/Debug/

      - name: Stage Themes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path .\Themes) {
            $dest = Join-Path $env:GITHUB_WORKSPACE ".build\x64\Debug\Themes"
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            Copy-Item -Path .\Themes\* -Destination $dest -Recurse -Force
          }

      - name: Verify and rebind portable build attestation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module .\Tools\Modules\Build\BuildEvidence.psm1 -Force
          Import-RSPortableBuildAttestation `
            -RepoRoot $env:GITHUB_WORKSPACE `
            -BuildOutputDir (Join-Path $env:GITHUB_WORKSPACE '.build\x64\Debug') `
            -PortableSchemaPath .\Specs\Build\PortableBuildAttestation.schema.json `
            -BuildReceiptSchemaPath .\Specs\Build\BuildReceipt.schema.json `
            -ToolchainSchemaPath .\Specs\Build\ToolchainIdentity.schema.json `
            -ExpectedRepository $env:GITHUB_REPOSITORY `
            -ExpectedWorkflow $env:GITHUB_WORKFLOW `
            -ExpectedRunId $env:GITHUB_RUN_ID `
            -ExpectedRunAttempt ([int]$env:GITHUB_RUN_ATTEMPT) `
            -ExpectedProducerJob 'build' `
            -ExpectedAttestationId '${{ needs.selftest-build.outputs.portable_attestation_id }}' `
            -ExpectedToolchainIdentityDigest '${{ needs.selftest-build.outputs.portable_toolchain_identity_digest }}' `
            -ExpectedSourceCommit $env:GITHUB_SHA `
            -ExpectedPlatform x64 `
            -ExpectedConfiguration Debug | Out-Null

      - name: Run CI test suite
        shell: pwsh
        run: |
          # Suite CI routes the PR gate through the unified runner, splits DxUiTests by suite,
          # and includes deterministic filesystem, configuration, plugin-contract, settings-schema,
          # and crash-handling coverage. Monitor ETW latency remains Suite Full-only.
          .\Tools\Run-AllTests.ps1 -Suite CI -ValidationMode Fresh -SkipBuild -TimeoutMultiplier 2.0 -AllowExternalTestRoot
        timeout-minutes: 210

      - name: Upload selftest artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selftest-artifacts
          path: ${{ steps.test-root.outputs.path }}\
          retention-days: 7
