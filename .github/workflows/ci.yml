name: CI

run-name: >-
  ${{ github.event_name == 'pull_request'
  && 'Suite PR on x64 Debug + ARM64 Debug (pull request)'
  || format('Suite PR on x64 + ARM64, Debug + Release ({0} {1})', github.event_name == 'push' && 'push to' || 'dispatch on', github.ref_name) }}

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR or branch supersedes the running gate.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration-guards:
    runs-on: windows-latest
    steps:
      - name: Enable long Windows checkout paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify migrated code no longer uses comctl subclass manager
        shell: pwsh
        run: .\Tools\Verify-NoSubclassManager.ps1

      - name: Verify comctl report-surface audit
        shell: pwsh
        run: .\Tools\Audit-ComctlReportSurfaces.ps1

      - name: Verify visible native surface audit
        shell: pwsh
        run: .\Tools\Audit-VisibleNativeSurfaces.ps1

  format:
    runs-on: windows-latest
    steps:
      - name: Enable long Windows checkout paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install pinned formatter
        shell: pwsh
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps --target .build/format -r Build/requirements-format.txt

      - name: Check changed native sources
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          $base = $env:BASE_SHA
          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') {
            $base = (git rev-parse HEAD^).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the comparison for manual formatting validation.' }
          }
          $changed = @(git diff --name-only --diff-filter=ACMR "$base...HEAD")
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enumerate changed native sources.' }
          $sources = @($changed | Where-Object { $_ -match '^(Common|Plugins|PoC|Red[^/]+|Tests|Tools)/.*\.(?:cpp|h)$' })
          $failed = @()
          foreach ($source in $sources) {
            & .build/format/clang_format/data/bin/clang-format.exe --dry-run --Werror --style=file $source
            if ($LASTEXITCODE -ne 0) { $failed += $source }
          }
          if ($failed.Count) { throw "Formatting differs in: $($failed -join ', ')" }
          Write-Host "Formatting passes for $($sources.Count) changed native files; archived evidence is excluded."
          $global:LASTEXITCODE = 0

  # Pull requests build one Debug profile per architecture on native runners; pushes to main add
  # both Release profiles. Every job runs Suite PR: the standalone test executables and tooling
  # contracts, about ten minutes, no in-product self-test suites and no classification reruns.
  # Suite CI (the in-product suites, one to four hours per profile) runs nightly from
  # nightly-ci.yml; ASan Debug runs from asan.yml, never as part of every push.
  native:
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"platform": "x64", "runner": "windows-2025-vs2026", "configuration": "Debug"},
          {"platform": "ARM64", "runner": "windows-11-vs2026-arm", "configuration": "Debug"}]'
          || '[{"platform": "x64", "runner": "windows-2025-vs2026", "configuration": "Debug"},
          {"platform": "x64", "runner": "windows-2025-vs2026", "configuration": "Release"},
          {"platform": "ARM64", "runner": "windows-11-vs2026-arm", "configuration": "Debug"},
          {"platform": "ARM64", "runner": "windows-11-vs2026-arm", "configuration": "Release"}]') }}
    uses: ./.github/workflows/build-reusable.yml
    with:
      configuration: ${{ matrix.configuration }}
      platform: ${{ matrix.platform }}
      native_runner: ${{ matrix.runner }}
      run_full_tests: true
      test_suite: PR
      upload_build_output: false
