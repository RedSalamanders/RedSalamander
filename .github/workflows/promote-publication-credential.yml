name: Promote publication credential to organization
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publication-credential-promotion
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Encrypt the existing token for the five application repositories and verify metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:WINGET_TOKEN -or $env:WINGET_TOKEN -match '\s') { throw 'A configured single-line repository WINGET_TOKEN is required.' }
          $repositories = @('RedSalamander','RedXe','RedMonitor','RedPrism','RedTilde')
          gh api user --silent
          if ($LASTEXITCODE -ne 0) { throw 'The existing publication token does not authenticate. No secret was changed.' }
          # Read-only permission preflight: failure changes no organization or repository secret.
          gh api orgs/RedSalamanders/actions/secrets/public-key --silent
          if ($LASTEXITCODE -ne 0) { throw 'The existing token cannot administer organization Actions secrets. An owner must supply that permission; no secret was changed.' }
          # gh encrypts stdin with the organization public key. Never pass the token in argv or print it.
          bash -e -o pipefail -c 'printf "%s" "$WINGET_TOKEN" | gh secret set WINGET_TOKEN --org RedSalamanders --visibility selected --repos RedSalamander,RedXe,RedMonitor,RedPrism,RedTilde'
          if ($LASTEXITCODE -ne 0) { throw 'Organization secret promotion failed; retain the existing repository credentials.' }
          $metadata = gh api orgs/RedSalamanders/actions/secrets/WINGET_TOKEN | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $metadata.visibility -cne 'selected') { throw 'Organization secret visibility could not be verified.' }
          $access = gh api 'orgs/RedSalamanders/actions/secrets/WINGET_TOKEN/repositories?per_page=100' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $access.total_count -ne 5) { throw 'Organization secret repository access could not be verified.' }
          $expected = @($repositories | ForEach-Object { 'RedSalamanders/' + $_ })
          if (Compare-Object $expected @($access.repositories.full_name)) { throw 'Organization secret access differs from the five applications; review it before publication.' }
          Write-Host ('Verified organization WINGET_TOKEN metadata for: ' + ($repositories -join ', ') + '. DxUi is excluded. Existing repository overrides are retained.')
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ('Organization WINGET_TOKEN selected for the five applications. DxUi excluded. Existing repository overrides retained. Token values were never logged; no product was published.')
