name: Verify publication credential without publishing
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: publication-credential-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Authenticate the effective token and check its declared public repository scope
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:GH_TOKEN -or $env:GH_TOKEN -match '\s') { throw 'A configured single-line WINGET_TOKEN is required.' }
          # Capture headers and account data in memory; never print or retain the response.
          $response = @(gh api user --include)
          if ($LASTEXITCODE -ne 0) { throw 'The configured publication token does not authenticate. No write was attempted.' }
          $scopeHeaders = @($response | Where-Object { $_ -match '^X-OAuth-Scopes:' })
          if ($scopeHeaders.Count -ne 1) { throw 'Authentication passed, but a classic PAT scope could not be verified. Use the documented public_repo token; no write was attempted.' }
          $scopes = @((($scopeHeaders[0] -split ':', 2)[1] -split ',') | ForEach-Object { $_.Trim() })
          if ('public_repo' -cnotin $scopes -and 'repo' -cnotin $scopes) { throw 'Authentication passed, but the token does not declare public_repo or repo. No write was attempted.' }
          $message = 'The effective WINGET_TOKEN authenticates and declares a public repository scope. This read-only check exercised no write permission, changed no secret and published nothing. Native installation, artifact qualification and upstream submission remain separate gates.'
          Write-Host $message
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $message
