name: Terminal Engine Gate 0

"on":
  workflow_dispatch:
  push:
    branches:
      - codex/terminal-engine-gate0

permissions:
  contents: read

jobs:
  collect:
    name: Collect ${{ matrix.platform }} ${{ matrix.configuration }}
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-gate0]')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_id: x64-release
            runner: windows-2025-vs2026
            platform: x64
            configuration: Release
          - artifact_id: x64-asan-debug
            runner: windows-2025-vs2026
            platform: x64
            configuration: ASan Debug
          - artifact_id: arm64-release
            runner: windows-11-vs2026-arm
            platform: ARM64
            configuration: Release

    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify focused Gate 0 contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(
            '.\Tools\Tests\TerminalDependencyLifecycle.Tests.ps1',
            '.\Tools\Tests\TerminalEngineArchive.Tests.ps1',
            '.\Tools\Tests\TerminalEngineNotices.Tests.ps1',
            '.\Tools\Tests\TerminalEngineCandidateAssessment.Tests.ps1',
            '.\Tools\Tests\TerminalEngineCandidateUniverseTransition.Tests.ps1',
            '.\Tools\Tests\TerminalEngineCollectionDescriptor.Tests.ps1',
            '.\Tools\Tests\TerminalEngineCollectionDriver.Tests.ps1',
            '.\Tools\Tests\TerminalEngineCollectionNeutrality.Tests.ps1',
            '.\Tools\Tests\TerminalEngineCollectionProvider.Tests.ps1',
            '.\Tools\Tests\TerminalEngineC7Proof.Tests.ps1',
            '.\Tools\Tests\TerminalEngineEvaluator.Tests.ps1',
            '.\Tools\Tests\TerminalEngineCandidatePatch.Tests.ps1',
            '.\Tools\Tests\TerminalEngineFixtureGenerator.Tests.ps1',
            '.\Tools\Tests\TerminalEngineSourceReview.Tests.ps1',
            '.\Tools\Tests\TerminalEngineGate0Harness.Tests.ps1',
            '.\Tools\Tests\TerminalEngineGate0Probe.Tests.ps1',
            '.\Tools\Tests\TerminalEngineNetworkIsolation.Tests.ps1',
            '.\Tools\Tests\TerminalEnginePeIdentity.Tests.ps1',
            '.\Tools\Tests\TerminalEvidence.Tests.ps1'
          )
          $pester = Get-Command Invoke-Pester -ErrorAction Stop
          if ($pester.Parameters.ContainsKey('Path')) {
            $result = Invoke-Pester -Path $tests -PassThru
          }
          else {
            $result = Invoke-Pester -Script $tests -PassThru
          }
          if ($result.FailedCount -ne 0) {
            throw "Gate 0 focused contracts failed: $($result.FailedCount)."
          }

      - name: Collect native clean offline evidence
        id: collect
        shell: pwsh
        env:
          RS_GATE0_PLATFORM: ${{ matrix.platform }}
          RS_GATE0_CONFIGURATION: ${{ matrix.configuration }}
          RS_GATE0_ARTIFACT_ID: ${{ matrix.artifact_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP "terminal-engine-$env:RS_GATE0_ARTIFACT_ID"
          [void][IO.Directory]::CreateDirectory($root)
          $manifestOutput = @(
            & .\Tools\Evaluate-TerminalEngines.ps1 `
              -Mode Collect `
              -Candidate All `
              -Platform $env:RS_GATE0_PLATFORM `
              -Configuration $env:RS_GATE0_CONFIGURATION `
              -Bootstrap `
              -Clean `
              -Offline `
              -EvidenceRoot $root `
              -PassThruManifest
          )
          if ($global:LASTEXITCODE -ne 0 -or $manifestOutput.Count -ne 1) {
            throw "Gate 0 collection failed with exit $global:LASTEXITCODE."
          }
          $manifest = [IO.Path]::GetFullPath([string]$manifestOutput[0])
          $rootFull = [IO.Path]::GetFullPath($root)
          if (-not $manifest.StartsWith(
              $rootFull + [IO.Path]::DirectorySeparatorChar,
              [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Collection returned a manifest outside its evidence root.'
          }
          $relative = [IO.Path]::GetRelativePath($rootFull, $manifest)
          [IO.File]::WriteAllText(
            (Join-Path $rootFull 'manifest-relative.txt'),
            $relative,
            [Text.UTF8Encoding]::new($false))

      - name: Upload exact collection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-engine-collection-${{ matrix.artifact_id }}
          path: ${{ runner.temp }}/terminal-engine-${{ matrix.artifact_id }}/
          if-no-files-found: error
          retention-days: 14

  finalize:
    name: Finalize winner
    needs: collect
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download exact collections
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: terminal-engine-collection-*
          path: ${{ runner.temp }}/terminal-engine-collections
          merge-multiple: false

      - name: Finalize the frozen comparison
        id: finalize
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $collections = Join-Path $env:RUNNER_TEMP 'terminal-engine-collections'
          $manifests = @()
          foreach ($id in @('arm64-release', 'x64-asan-debug', 'x64-release')) {
            $artifactRoot = Join-Path $collections "terminal-engine-collection-$id"
            $index = Join-Path $artifactRoot 'manifest-relative.txt'
            if (-not [IO.File]::Exists($index)) {
              throw "Collection index is missing for '$id'."
            }
            $relative = [IO.File]::ReadAllText($index)
            if ([string]::IsNullOrWhiteSpace($relative) -or
                [IO.Path]::IsPathRooted($relative) -or
                $relative.Split([IO.Path]::DirectorySeparatorChar) -contains '..') {
              throw "Collection index is unsafe for '$id'."
            }
            $manifest = [IO.Path]::GetFullPath((Join-Path $artifactRoot $relative))
            $artifactFull = [IO.Path]::GetFullPath($artifactRoot)
            if (-not $manifest.StartsWith(
                $artifactFull + [IO.Path]::DirectorySeparatorChar,
                [StringComparison]::OrdinalIgnoreCase) -or
                -not [IO.File]::Exists($manifest)) {
              throw "Collection manifest is missing or outside '$id'."
            }
            $manifests += $manifest
          }

          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'terminal-engine-final'
          [void][IO.Directory]::CreateDirectory($evidenceRoot)
          $finalOutput = @(
            & .\Tools\Evaluate-TerminalEngines.ps1 `
              -Mode Finalize `
              -Candidate All `
              -EvidenceManifest $manifests `
              -EvidenceRoot $evidenceRoot `
              -RequireAllEvidence `
              -PassThruManifest
          )
          $exitCode = [int]$global:LASTEXITCODE
          if ($exitCode -notin 0, 20 -or $finalOutput.Count -ne 1) {
            throw "Gate 0 finalization failed with exit $exitCode."
          }
          $manifest = [IO.Path]::GetFullPath([string]$finalOutput[0])
          $rootFull = [IO.Path]::GetFullPath($evidenceRoot)
          if (-not $manifest.StartsWith(
              $rootFull + [IO.Path]::DirectorySeparatorChar,
              [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Finalization returned a manifest outside its evidence root.'
          }
          $relative = [IO.Path]::GetRelativePath($rootFull, $manifest)
          [IO.File]::WriteAllText(
            (Join-Path $rootFull 'manifest-relative.txt'),
            $relative,
            [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText(
            (Join-Path $rootFull 'selection-exit.txt'),
            $exitCode.ToString([Globalization.CultureInfo]::InvariantCulture),
            [Text.UTF8Encoding]::new($false))

      - name: Upload exact finalization
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-engine-finalization
          path: ${{ runner.temp }}/terminal-engine-final/
          if-no-files-found: error
          retention-days: 30

      - name: Require an evidence-backed winner
        shell: pwsh
        run: |
          $exitPath = Join-Path $env:RUNNER_TEMP 'terminal-engine-final\selection-exit.txt'
          if (-not [IO.File]::Exists($exitPath) -or
              [IO.File]::ReadAllText($exitPath) -cne '0') {
            throw 'Gate 0 completed without a winner.'
          }
