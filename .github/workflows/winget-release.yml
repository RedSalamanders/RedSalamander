name: Publish to Winget

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 7.0.183)"
        required: true
        type: string
      submit:
        description: "Submit to microsoft/winget-pkgs after validation and install test."
        required: false
        type: boolean
        default: false

jobs:
  publish-winget:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Get version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $rawVersion = "${{ github.event.inputs.version }}".Trim()
            $version = $rawVersion -replace '^[vV]', ''
            $tag = "v$version"
          } else {
            $tag = "${{ github.event.release.tag_name }}".Trim()
            $version = $tag -replace '^[vV]', ''
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must be a three-part version, optionally prefixed with 'v' for manual runs. Received: '$version'"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"
          Write-Host "Tag: $tag"

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Download portable release assets
        id: portable
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $assetNames = @(
            "RedSalamander-$version-x64-Portable.zip",
            "RedSalamander-$version-ARM64-Portable.zip"
          )
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
          foreach ($assetName in $assetNames) {
            $asset = $release.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
            if (-not $asset) {
              $available = ($release.assets | ForEach-Object { "  $($_.name)" }) -join "`n"
              throw "Expected portable asset '$assetName' was not found on release '$tag'. Available assets:`n$available"
            }

            $outFile = if ($assetName -like "*ARM64*") { "RedSalamander-ARM64.zip" } else { "RedSalamander-x64.zip" }
            Write-Host "Downloading $assetName from $($asset.browser_download_url)"
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $outFile
            Get-ChildItem $outFile | ForEach-Object { Write-Host "Downloaded $($_.Name) - $($_.Length) bytes" }
          }

      - name: Generate Winget manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\Installer\winget\generate-manifest.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -ZipPath "RedSalamander-x64.zip" `
            -Arm64ZipPath "RedSalamander-ARM64.zip" `
            -OutputDir "winget-manifest"
          Get-ChildItem winget-manifest | ForEach-Object { Write-Host "Generated $($_.Name)" }

      - name: Install winget-create
        shell: pwsh
        run: |
          Write-Host "Installing winget-create..."
          winget install --exact --id Microsoft.WingetCreate --silent --accept-source-agreements --accept-package-agreements

      - name: Validate Winget manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Convert-RSWingetVersion([string]$VersionText) {
            $normalized = $VersionText.Trim() -replace '^[vV]', ''
            $parts = $normalized -split '\.'
            if ($parts.Count -lt 2) { return $null }

            try {
              return [version]::new([int]$parts[0], [int]$parts[1])
            } catch {
              return $null
            }
          }

          function Test-RSLegacyWingetSchemaHeaderWarning([string]$WingetVersion, [string[]]$OutputLines) {
            $parsedVersion = Convert-RSWingetVersion -VersionText $WingetVersion
            if (-not $parsedVersion -or $parsedVersion -ge [version]'1.12') { return $false }

            $hasSucceededWithWarnings = $OutputLines | Where-Object {
              $_ -match '^Manifest validation succeeded with warnings\.$'
            } | Select-Object -First 1
            if (-not $hasSucceededWithWarnings) { return $false }

            $warningLines = @($OutputLines | Where-Object { $_ -match '^Manifest Warning:' })
            if ($warningLines.Count -eq 0) { return $false }

            foreach ($warning in $warningLines) {
              if ($warning -notmatch 'The schema header URL does not match the expected pattern') { return $false }
              if ($warning -notmatch 'winget-manifest\.(installer|defaultLocale|version)\.1\.12\.0\.schema\.json') { return $false }
            }

            return $true
          }

          Write-Host "winget.exe version:"
          $wingetVersion = (& winget --version).Trim()
          Write-Host $wingetVersion

          $oldNativeErrorPreference = $PSNativeCommandUseErrorActionPreference
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            $validationOutput = @(& winget validate --manifest "winget-manifest" 2>&1 | ForEach-Object { $_.ToString() })
            $validationExitCode = $LASTEXITCODE
          } finally {
            $PSNativeCommandUseErrorActionPreference = $oldNativeErrorPreference
          }

          $validationOutput | ForEach-Object { Write-Host $_ }
          if ($validationExitCode -eq 0) { exit 0 }

          if (Test-RSLegacyWingetSchemaHeaderWarning -WingetVersion $wingetVersion -OutputLines $validationOutput) {
            Write-Warning "Ignoring winget.exe $wingetVersion schema-header warning for ManifestVersion 1.12.0. Newer winget validators accept these headers."
            exit 0
          }

          throw "winget validate failed with exit code $validationExitCode."

      - name: Test Winget install
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Enabling winget local manifest installs..."
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE -ne 0) {
            throw "winget settings --enable LocalManifestFiles failed with exit code $LASTEXITCODE."
          }

          winget install `
            --manifest "winget-manifest" `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity `
            --ignore-warnings `
            --force

          if ($LASTEXITCODE -ne 0) {
            throw "winget install --manifest failed with exit code $LASTEXITCODE."
          }

          winget list --exact --id RedSalamanders.RedSalamander --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "RedSalamander was not found in winget list after manifest install."
          }

      - name: Cleanup Winget install test
        if: always()
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Continue"

          winget uninstall `
            --exact `
            --id RedSalamanders.RedSalamander `
            --silent `
            --purge `
            --accept-source-agreements `
            --disable-interactivity `
            --ignore-warnings

      - name: Submit to Winget
        if: ${{ github.event_name == 'release' || inputs.submit }}
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Error "WINGET_TOKEN secret is not set. Please add it to repository secrets."
            exit 1
          }

          $version = "${{ steps.version.outputs.version }}"

          Write-Host "Submitting portable package version $version to winget..."
          wingetcreate submit `
            --prtitle "RedSalamander $version" `
            --token $env:WINGET_TOKEN `
            --no-open `
            "winget-manifest"

      - name: Summary
        if: success()
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          if ("${{ github.event_name }}" -eq "release" -or "${{ inputs.submit }}" -eq "true") {
            Write-Host "Successfully submitted RedSalamander $version portable ZIP to winget." -ForegroundColor Green
            Write-Host "The winget community repository maintainers will review the PR."
          } else {
            Write-Host "Validated and install-tested RedSalamander $version winget manifest. Submission was skipped for this manual run." -ForegroundColor Green
          }
