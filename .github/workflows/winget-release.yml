name: Publish to Winget

on:
  workflow_call:
    inputs:
      version:
        description: "Validated three-part version to publish."
        required: true
        type: string
      submit:
        description: "Submit after validation and install testing."
        required: false
        type: boolean
        default: true
    secrets:
      WINGET_TOKEN:
        required: true
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 7.0.183)"
        required: true
        type: string
      submit:
        description: "Submit to microsoft/winget-pkgs after validation and install test."
        required: false
        type: boolean
        default: false

concurrency:
  group: winget-RedSalamanders.RedSalamander-${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', inputs.version || github.event.inputs.version) }}
  cancel-in-progress: false

jobs:
  publish-winget:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      WINGET_MANIFEST_ROOT: .build\AppPackages\winget-manifest

    steps:
      - name: Get version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version || github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:EVENT_NAME -in "workflow_dispatch", "workflow_call") {
            $rawVersion = $env:REQUESTED_VERSION.Trim()
            $version = $rawVersion
            $tag = "v$version"
          } else {
            $rawVersion = $env:RELEASE_TAG.Trim()
            $tag = $rawVersion
            $version = $tag -replace '^v', ''
          }

          if ($rawVersion.Length -gt 64 -or
              $version -notmatch '^\d+\.\d+\.\d+$' -or
              ($env:EVENT_NAME -eq 'release' -and $rawVersion -notmatch '^v\d+\.\d+\.\d+$')) {
            throw "Version must be a three-part version; release tags must use the lowercase 'v' prefix. Received: '$rawVersion'"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"
          Write-Host "Tag: $tag"

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.tag }}
          persist-credentials: false

      - name: Checkout publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .winget-automation
          sparse-checkout: Tools/Modules/Packaging/WingetPrPublication.psm1
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download portable release assets
        id: portable
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $assetNames = @(
            "RedSalamander-$version-x64-Portable.zip",
            "RedSalamander-$version-ARM64-Portable.zip"
          )
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
          foreach ($assetName in $assetNames) {
            $asset = $release.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
            if (-not $asset) {
              $available = ($release.assets | ForEach-Object { "  $($_.name)" }) -join "`n"
              throw "Expected portable asset '$assetName' was not found on release '$tag'. Available assets:`n$available"
            }

            $outFile = $assetName
            Write-Host "Downloading $assetName from $($asset.browser_download_url)"
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $outFile
            Get-ChildItem $outFile | ForEach-Object { Write-Host "Downloaded $($_.Name) - $($_.Length) bytes" }
          }

          # The manifest ReleaseDate comes from the release itself so that reruns on later days
          # generate identical manifests and keep the same publication identity.
          # Invoke-RestMethod deserializes ISO 8601 timestamps to [datetime] (Kind Utc), so the
          # value is a date object, not the "2026-09-17T21:07:11Z" text; accept either shape.
          function Get-RSReleaseDate([object]$PublishedAt) {
            if ($PublishedAt -is [datetime]) {
              $utc = if ($PublishedAt.Kind -eq [DateTimeKind]::Unspecified) { [datetime]::SpecifyKind($PublishedAt, [DateTimeKind]::Utc) } else { $PublishedAt.ToUniversalTime() }
            } else {
              $text = [string]$PublishedAt
              if ([string]::IsNullOrWhiteSpace($text)) { throw "The release did not report a published_at timestamp." }
              $parsed = [DateTimeOffset]::MinValue
              if (-not [DateTimeOffset]::TryParse($text, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::AssumeUniversal, [ref]$parsed)) {
                throw "The release published_at value is not a recognizable timestamp: '$text'"
              }
              $utc = $parsed.UtcDateTime
            }
            return $utc.ToString('yyyy-MM-dd', [Globalization.CultureInfo]::InvariantCulture)
          }
          $releaseDate = Get-RSReleaseDate $release.published_at
          "release_date=$releaseDate" >> $env:GITHUB_OUTPUT
          Write-Host "Release date: $releaseDate"

      - name: Generate Winget manifest
        shell: pwsh
        env:
          RELEASE_DATE: ${{ steps.portable.outputs.release_date }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $generator = ".\Installer\winget\generate-manifest.ps1"
          $generatorArguments = @{
            Version = $version
            ZipPath = "RedSalamander-$version-x64-Portable.zip"
            Arm64ZipPath = "RedSalamander-$version-ARM64-Portable.zip"
            OutputDir = $env:WINGET_MANIFEST_ROOT
          }
          # The generator runs from the release tag; tags older than the -ReleaseDate parameter fall
          # back to its own default, which stamps the generation day and makes reruns non-identical.
          if ((Get-Command $generator).Parameters.ContainsKey('ReleaseDate')) {
            $generatorArguments.ReleaseDate = $env:RELEASE_DATE
          } else {
            Write-Warning "This release tag's generate-manifest.ps1 has no -ReleaseDate parameter; the manifest ReleaseDate will be today's date and a rerun on another day will not resume this publication."
          }
          & $generator @generatorArguments
          Get-ChildItem $env:WINGET_MANIFEST_ROOT | ForEach-Object { Write-Host "Generated $($_.Name)" }

      - name: Install winget-create
        id: wingetcreate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expectedVersion = "1.12.8.0"
          Write-Host "Installing reviewed winget-create $expectedVersion..."
          winget install --exact --id Microsoft.WingetCreate --version $expectedVersion --silent --disable-interactivity --accept-source-agreements --accept-package-agreements
          if ($LASTEXITCODE -ne 0) {
            throw "winget-create $expectedVersion install failed with exit code $LASTEXITCODE."
          }

          $command = Get-Command wingetcreate.exe -CommandType Application -ErrorAction Stop
          $resolvedPath = $command.Source
          # wingetcreate prints "WingetCreateCLI <version>+<commit>", then appends its verb help and exits non-zero.
          $versionText = (@(& $resolvedPath --version 2>&1 | ForEach-Object { $_.ToString() })) -join "`n"
          $global:LASTEXITCODE = 0
          $versionMatch = [regex]::Match($versionText, '(?m)^\s*WingetCreateCLI\s+(?<version>\d+(?:\.\d+){1,3})\+[0-9a-fA-F]{7,40}(?:\s|$)')
          if (-not $versionMatch.Success) {
            throw "Could not read a winget-create version from: $($versionText -replace '\s+', ' ')"
          }
          $resolvedVersion = $versionMatch.Groups['version'].Value
          if ($resolvedVersion -ne $expectedVersion) {
            throw "Resolved winget-create version '$resolvedVersion' does not match reviewed version '$expectedVersion'."
          }
          "path=$resolvedPath" >> $env:GITHUB_OUTPUT
          "version=$resolvedVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Verified winget-create $resolvedVersion at $resolvedPath"
          exit 0

      - name: Validate Winget manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Convert-RSWingetVersion([string]$VersionText) {
            $normalized = $VersionText.Trim() -replace '^[vV]', ''
            $parts = $normalized -split '\.'
            if ($parts.Count -lt 2) { return $null }

            try {
              return [version]::new([int]$parts[0], [int]$parts[1])
            } catch {
              return $null
            }
          }

          function Test-RSLegacyWingetSchemaHeaderWarning([string]$WingetVersion, [string[]]$OutputLines) {
            $parsedVersion = Convert-RSWingetVersion -VersionText $WingetVersion
            if (-not $parsedVersion -or $parsedVersion -ge [version]'1.12') { return $false }

            $hasSucceededWithWarnings = $OutputLines | Where-Object {
              $_ -match '^Manifest validation succeeded with warnings\.$'
            } | Select-Object -First 1
            if (-not $hasSucceededWithWarnings) { return $false }

            $warningLines = @($OutputLines | Where-Object { $_ -match '^Manifest Warning:' })
            if ($warningLines.Count -eq 0) { return $false }

            foreach ($warning in $warningLines) {
              if ($warning -notmatch 'The schema header URL does not match the expected pattern') { return $false }
              if ($warning -notmatch 'winget-manifest\.(installer|defaultLocale|version)\.1\.12\.0\.schema\.json') { return $false }
            }

            return $true
          }

          Write-Host "winget.exe version:"
          $wingetVersion = (& winget --version).Trim()
          Write-Host $wingetVersion

          $oldNativeErrorPreference = $PSNativeCommandUseErrorActionPreference
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            $validationOutput = @(& winget validate --manifest $env:WINGET_MANIFEST_ROOT 2>&1 | ForEach-Object { $_.ToString() })
            $validationExitCode = $LASTEXITCODE
          } finally {
            $PSNativeCommandUseErrorActionPreference = $oldNativeErrorPreference
          }

          $validationOutput | ForEach-Object { Write-Host $_ }
          if ($validationExitCode -eq 0) { exit 0 }

          if (Test-RSLegacyWingetSchemaHeaderWarning -WingetVersion $wingetVersion -OutputLines $validationOutput) {
            Write-Warning "Ignoring winget.exe $wingetVersion schema-header warning for ManifestVersion 1.12.0. Newer winget validators accept these headers."
            exit 0
          }

          throw "winget validate failed with exit code $validationExitCode."

      - name: Test Winget install
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Enabling winget local manifest installs..."
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE -ne 0) {
            throw "winget settings --enable LocalManifestFiles failed with exit code $LASTEXITCODE."
          }

          winget install `
            --manifest $env:WINGET_MANIFEST_ROOT `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity `
            --ignore-warnings `
            --force

          if ($LASTEXITCODE -ne 0) {
            throw "winget install --manifest failed with exit code $LASTEXITCODE."
          }

          winget list --exact --id RedSalamanders.RedSalamander --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "RedSalamander was not found in winget list after manifest install."
          }

      - name: Cleanup Winget install test
        if: always()
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false

          # APPINSTALLER_CLI_ERROR_NO_APPLICATIONS_FOUND (0x8A150014).
          $noApplicationsFound = -1978335212

          # Cleanup also runs when the install test was skipped or failed before installing.
          winget list `
            --exact `
            --id RedSalamanders.RedSalamander `
            --accept-source-agreements `
            --disable-interactivity
          $listExitCode = $LASTEXITCODE
          if ($listExitCode -eq $noApplicationsFound) {
            Write-Host "RedSalamander is not installed; nothing to clean up."
            exit 0
          }
          if ($listExitCode -ne 0) {
            throw "winget list failed with exit code $listExitCode."
          }

          winget uninstall `
            --exact `
            --id RedSalamanders.RedSalamander `
            --silent `
            --purge `
            --accept-source-agreements `
            --disable-interactivity `
            --ignore-warnings
          if ($LASTEXITCODE -ne 0) {
            throw "winget uninstall failed with exit code $LASTEXITCODE."
          }
          exit 0

      - name: Submit to Winget
        id: winget_submission
        if: ${{ github.event_name == 'release' || inputs.submit }}
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          WINGETCREATE_PATH: ${{ steps.wingetcreate.outputs.path }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          PUBLICATION_MODULE: ${{ github.workspace }}\.winget-automation\Tools\Modules\Packaging\WingetPrPublication.psm1
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) {
            throw "WINGET_TOKEN secret is not set. Please add it to repository secrets."
          }
          if (-not (Test-Path -LiteralPath $env:WINGETCREATE_PATH -PathType Leaf)) {
            throw "The verified winget-create executable is no longer present."
          }
          if (-not (Test-Path -LiteralPath $env:PUBLICATION_MODULE -PathType Leaf)) {
            throw "The reviewed Winget publication module is not available."
          }

          Import-Module $env:PUBLICATION_MODULE -Force
          $version = $env:PACKAGE_VERSION
          $tag = $env:RELEASE_TAG
          $pullRequestTitle = "Update: RedSalamanders.RedSalamander to $version"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:WINGET_CREATE_GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $tokenUser = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/user" -ResponseHeadersVariable tokenResponseHeaders
          $expectedAuthor = [string]$tokenUser.login
          if ($expectedAuthor -notmatch '^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$') {
            throw "The Winget token owner could not be resolved to a valid GitHub login."
          }
          $expectedHeadRepository = "$expectedAuthor/winget-pkgs"

          # Scope names are not secrets. WingetCreate needs a classic token with public_repo (fine-grained
          # tokens report no classic scopes and are unsupported), so a wrong token shape is named here
          # instead of surfacing later as an opaque submit failure.
          $scopeHeader = $tokenResponseHeaders.Keys | Where-Object { $_ -ieq 'X-OAuth-Scopes' } | Select-Object -First 1
          $tokenScopes = if ($scopeHeader) { [string](@($tokenResponseHeaders[$scopeHeader]) -join ', ') } else { '' }
          $scopeList = @($tokenScopes -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          Write-Host "Winget token owner: $expectedAuthor; head repository: $expectedHeadRepository; classic scopes: $(if ($scopeList.Count -gt 0) { $scopeList -join ', ' } else { '(none reported)' })"
          if ($scopeList -notcontains 'public_repo' -and $scopeList -notcontains 'repo') {
            Write-Warning "WINGET_TOKEN does not report the classic 'public_repo' scope that WingetCreate requires to fork microsoft/winget-pkgs and open a pull request; a fine-grained token is not supported by winget-create 1.12.8.0."
          }

          $identity = New-RSWingetPublicationIdentity `
            -PackageIdentifier "RedSalamanders.RedSalamander" `
            -Version $version `
            -ManifestRoot (Join-Path $env:GITHUB_WORKSPACE $env:WINGET_MANIFEST_ROOT) `
            -PullRequestTitle $pullRequestTitle

          $listPullRequests = {
            param([int]$Page, [int]$PageSize)
            Invoke-RestMethod `
              -Headers $headers `
              -Uri "https://api.github.com/repos/microsoft/winget-pkgs/pulls?state=all&sort=updated&direction=desc&per_page=$PageSize&page=$Page"
          }.GetNewClosure()
          $listPullRequestFiles = {
            param([int]$Number, [int]$Page, [int]$PageSize)
            Invoke-RestMethod `
              -Headers $headers `
              -Uri "https://api.github.com/repos/microsoft/winget-pkgs/pulls/$Number/files?per_page=$PageSize&page=$Page"
          }.GetNewClosure()
          $getManifestContentHash = {
            param([string]$RepositoryFullName, [string]$Path, [string]$Ref)
            if ($RepositoryFullName -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' -or $Ref -notmatch '^[0-9a-fA-F]{40}$') {
              throw "The Winget pull request returned an invalid head repository or commit."
            }
            $encodedPath = (($Path -split '/') | ForEach-Object { [uri]::EscapeDataString($_) }) -join '/'
            $encodedRef = [uri]::EscapeDataString($Ref)
            $content = Invoke-RestMethod `
              -Headers $headers `
              -Uri "https://api.github.com/repos/$RepositoryFullName/contents/$encodedPath?ref=$encodedRef"
            $bytes = [Convert]::FromBase64String(([string]$content.content -replace '\s', ''))
            # wingetcreate re-serializes manifests before committing, so compare the canonical form.
            return Get-RSWingetManifestContentHash -Bytes $bytes
          }.GetNewClosure()
          $patchPullRequest = {
            param([int]$Number, [string]$Title, [string]$Body)
            $payload = @{ title = $Title; body = $Body } | ConvertTo-Json
            Invoke-RestMethod `
              -Method Patch `
              -Headers $headers `
              -ContentType "application/json" `
              -Body $payload `
              -Uri "https://api.github.com/repos/microsoft/winget-pkgs/pulls/$Number"
          }.GetNewClosure()
          $repository = @{
            ListPullRequests = $listPullRequests
            ListPullRequestFiles = $listPullRequestFiles
            GetManifestContentHash = $getManifestContentHash
            PatchPullRequest = $patchPullRequest
          }

          $releaseUrl = "https://github.com/$($env:SOURCE_REPOSITORY)/releases/tag/$tag"
          $pullRequestBody = @"
          ## 📖 Description

          Updates ``RedSalamanders.RedSalamander`` to version ``$version``.

          - **Release:** [RedSalamander $version]($releaseUrl)
          - **Installer type:** ZIP with portable nested installers
          - **Architectures:** x64 and arm64
          - **Commands:** ``RedSalamander`` and ``red``
          - **Minimum OS:** Windows 11 build 22000.2600
          - **Manifest schema:** 1.12.0

          ## 🧪 Automated validation

          The release workflow completed these checks on a clean GitHub-hosted Windows runner before submission:

          - ``winget validate --manifest .build\AppPackages\winget-manifest``
          - ``winget install --manifest .build\AppPackages\winget-manifest`` for the generated portable package
          - ``winget list --exact --id RedSalamanders.RedSalamander`` after installation
          - Cleanup with ``winget uninstall --exact --id RedSalamanders.RedSalamander --purge``

          ## ✅ Checklist

          - [x] Signed the [Contributor License Agreement](https://cla.opensource.microsoft.com)

          ## 📦 Manifest Checklist

          - [x] Checked that there aren't other open [pull requests](https://github.com/microsoft/winget-pkgs/pulls) for the same manifest update/change
          - [x] This PR only modifies one (1) manifest
          - [x] Validated the manifest with ``winget validate --manifest .build\AppPackages\winget-manifest`` ([validation guide](https://github.com/microsoft/winget-pkgs/blob/master/doc/ValidationFailureGuide.md))
          - [x] Tested the manifest with ``winget install --manifest .build\AppPackages\winget-manifest``
          - [x] Manifest conforms to the [1.12 schema](https://github.com/microsoft/winget-pkgs/tree/master/doc/manifest/schema/1.12.0)
          "@
          $submit = {
            param([string]$InitialTitle)
            $oldNativeErrorPreference = $PSNativeCommandUseErrorActionPreference
            try {
              $PSNativeCommandUseErrorActionPreference = $false
              $output = @(& $env:WINGETCREATE_PATH submit `
                  --prtitle $InitialTitle `
                  --no-open `
                  $env:WINGET_MANIFEST_ROOT 2>&1 | ForEach-Object { $_.ToString() })
              $exitCode = $LASTEXITCODE
            } finally {
              $PSNativeCommandUseErrorActionPreference = $oldNativeErrorPreference
            }
            return [pscustomobject]@{ ExitCode = $exitCode; Output = $output }
          }
          $wait = {
            param([int]$Attempt)
            # 15, 30, 45, 60, 60 s: GitHub can take minutes to expose a fresh PR's file list and
            # contents, and the state check itself no longer spends that time scanning.
            Start-Sleep -Seconds ([Math]::Min(15 * $Attempt, 60))
          }
          $publication = Invoke-RSWingetPublication `
            -Identity $identity `
            -ExpectedAuthor $expectedAuthor `
            -ExpectedHeadRepository $expectedHeadRepository `
            -PullRequestBody $pullRequestBody `
            -Repository $repository `
            -Submit $submit `
            -Wait $wait `
            -MaximumVisibilityAttempts 6

          "pull_request_url=$($publication.Url)" >> $env:GITHUB_OUTPUT
          Write-Host "Winget pull request: $($publication.Url)" -ForegroundColor Green

      - name: Summary
        if: success()
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          if ("${{ github.event_name }}" -eq "release" -or "${{ inputs.submit }}" -eq "true") {
            Write-Host "Successfully submitted RedSalamander $version portable ZIP to winget." -ForegroundColor Green
            Write-Host "The winget community repository maintainers will review the PR."
          } else {
            Write-Host "Validated and install-tested RedSalamander $version winget manifest. Submission was skipped for this manual run." -ForegroundColor Green
          }
