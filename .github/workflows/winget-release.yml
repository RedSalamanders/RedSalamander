name: Publish to Winget

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 7.0.183)"
        required: true
        type: string
      submit:
        description: "Submit to microsoft/winget-pkgs after validation and install test."
        required: false
        type: boolean
        default: false

jobs:
  publish-winget:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Get version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $rawVersion = "${{ github.event.inputs.version }}".Trim()
            $version = $rawVersion -replace '^[vV]', ''
            $tag = "v$version"
          } else {
            $tag = "${{ github.event.release.tag_name }}".Trim()
            $version = $tag -replace '^[vV]', ''
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must be a three-part version, optionally prefixed with 'v' for manual runs. Received: '$version'"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"
          Write-Host "Tag: $tag"

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Download portable release assets
        id: portable
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $assetNames = @(
            "RedSalamander-$version-x64-Portable.zip",
            "RedSalamander-$version-ARM64-Portable.zip"
          )
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
          foreach ($assetName in $assetNames) {
            $asset = $release.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
            if (-not $asset) {
              $available = ($release.assets | ForEach-Object { "  $($_.name)" }) -join "`n"
              throw "Expected portable asset '$assetName' was not found on release '$tag'. Available assets:`n$available"
            }

            $outFile = if ($assetName -like "*ARM64*") { "RedSalamander-ARM64.zip" } else { "RedSalamander-x64.zip" }
            Write-Host "Downloading $assetName from $($asset.browser_download_url)"
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $outFile
            Get-ChildItem $outFile | ForEach-Object { Write-Host "Downloaded $($_.Name) - $($_.Length) bytes" }
          }

      - name: Generate Winget manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\Installer\winget\generate-manifest.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -ZipPath "RedSalamander-x64.zip" `
            -Arm64ZipPath "RedSalamander-ARM64.zip" `
            -OutputDir "winget-manifest"
          Get-ChildItem winget-manifest | ForEach-Object { Write-Host "Generated $($_.Name)" }

      - name: Install winget-create
        shell: pwsh
        run: |
          Write-Host "Installing winget-create..."
          winget install --exact --id Microsoft.WingetCreate --silent --accept-source-agreements --accept-package-agreements

      - name: Validate Winget manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Convert-RSWingetVersion([string]$VersionText) {
            $normalized = $VersionText.Trim() -replace '^[vV]', ''
            $parts = $normalized -split '\.'
            if ($parts.Count -lt 2) { return $null }

            try {
              return [version]::new([int]$parts[0], [int]$parts[1])
            } catch {
              return $null
            }
          }

          function Test-RSLegacyWingetSchemaHeaderWarning([string]$WingetVersion, [string[]]$OutputLines) {
            $parsedVersion = Convert-RSWingetVersion -VersionText $WingetVersion
            if (-not $parsedVersion -or $parsedVersion -ge [version]'1.12') { return $false }

            $hasSucceededWithWarnings = $OutputLines | Where-Object {
              $_ -match '^Manifest validation succeeded with warnings\.$'
            } | Select-Object -First 1
            if (-not $hasSucceededWithWarnings) { return $false }

            $warningLines = @($OutputLines | Where-Object { $_ -match '^Manifest Warning:' })
            if ($warningLines.Count -eq 0) { return $false }

            foreach ($warning in $warningLines) {
              if ($warning -notmatch 'The schema header URL does not match the expected pattern') { return $false }
              if ($warning -notmatch 'winget-manifest\.(installer|defaultLocale|version)\.1\.12\.0\.schema\.json') { return $false }
            }

            return $true
          }

          Write-Host "winget.exe version:"
          $wingetVersion = (& winget --version).Trim()
          Write-Host $wingetVersion

          $oldNativeErrorPreference = $PSNativeCommandUseErrorActionPreference
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            $validationOutput = @(& winget validate --manifest "winget-manifest" 2>&1 | ForEach-Object { $_.ToString() })
            $validationExitCode = $LASTEXITCODE
          } finally {
            $PSNativeCommandUseErrorActionPreference = $oldNativeErrorPreference
          }

          $validationOutput | ForEach-Object { Write-Host $_ }
          if ($validationExitCode -eq 0) { exit 0 }

          if (Test-RSLegacyWingetSchemaHeaderWarning -WingetVersion $wingetVersion -OutputLines $validationOutput) {
            Write-Warning "Ignoring winget.exe $wingetVersion schema-header warning for ManifestVersion 1.12.0. Newer winget validators accept these headers."
            exit 0
          }

          throw "winget validate failed with exit code $validationExitCode."

      - name: Test Winget install
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Enabling winget local manifest installs..."
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE -ne 0) {
            throw "winget settings --enable LocalManifestFiles failed with exit code $LASTEXITCODE."
          }

          winget install `
            --manifest "winget-manifest" `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity `
            --ignore-warnings `
            --force

          if ($LASTEXITCODE -ne 0) {
            throw "winget install --manifest failed with exit code $LASTEXITCODE."
          }

          winget list --exact --id RedSalamanders.RedSalamander --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "RedSalamander was not found in winget list after manifest install."
          }

      - name: Cleanup Winget install test
        if: always()
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Continue"

          winget uninstall `
            --exact `
            --id RedSalamanders.RedSalamander `
            --silent `
            --purge `
            --accept-source-agreements `
            --disable-interactivity `
            --ignore-warnings

      - name: Submit to Winget
        id: winget_submission
        if: ${{ github.event_name == 'release' || inputs.submit }}
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:WINGET_TOKEN) {
            throw "WINGET_TOKEN secret is not set. Please add it to repository secrets."
          }

          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $pullRequestTitle = "Update: RedSalamanders.RedSalamander to $version"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:WINGET_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $duplicateQuery = [uri]::EscapeDataString("repo:microsoft/winget-pkgs is:pr is:open in:title RedSalamander $version")
          $duplicateSearch = Invoke-RestMethod `
            -Headers $headers `
            -Uri "https://api.github.com/search/issues?q=$duplicateQuery&per_page=10"
          if ($duplicateSearch.total_count -gt 0) {
            $duplicateUrls = ($duplicateSearch.items | ForEach-Object { "  $($_.html_url)" }) -join "`n"
            throw "An open Winget pull request already appears to submit RedSalamander ${version}:`n$duplicateUrls"
          }

          Write-Host "Submitting portable package version $version to winget..."
          $oldNativeErrorPreference = $PSNativeCommandUseErrorActionPreference
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            $submitOutput = @(& wingetcreate submit `
                --prtitle $pullRequestTitle `
                --token $env:WINGET_TOKEN `
                --no-open `
                "winget-manifest" 2>&1 | ForEach-Object { $_.ToString() })
            $submitExitCode = $LASTEXITCODE
          } finally {
            $PSNativeCommandUseErrorActionPreference = $oldNativeErrorPreference
          }

          $submitOutput | ForEach-Object { Write-Host $_ }
          if ($submitExitCode -ne 0) {
            throw "wingetcreate submit failed with exit code $submitExitCode."
          }

          $pullRequestMatch = [regex]::Match(
            ($submitOutput -join "`n"),
            'https://github\.com/microsoft/winget-pkgs/pull/(?<number>\d+)')
          if (-not $pullRequestMatch.Success) {
            throw "wingetcreate submit succeeded, but its output did not contain the created pull request URL."
          }

          $pullRequestNumber = [int]$pullRequestMatch.Groups['number'].Value
          $releaseUrl = "https://github.com/${{ github.repository }}/releases/tag/$tag"
          $pullRequestBody = @"
          <!-- Generated by the RedSalamander Winget release workflow. -->

          ## 📖 Description

          Updates ``RedSalamanders.RedSalamander`` to version ``$version``.

          - **Release:** [RedSalamander $version]($releaseUrl)
          - **Installer type:** ZIP with portable nested installers
          - **Architectures:** x64 and arm64
          - **Commands:** ``RedSalamander`` and ``red``
          - **Minimum OS:** Windows 11 build 22000.2600
          - **Manifest schema:** 1.12.0

          ## 🧪 Automated validation

          The release workflow completed these checks on a clean GitHub-hosted Windows runner before submission:

          - ``winget validate --manifest winget-manifest``
          - ``winget install --manifest winget-manifest`` for the generated portable package
          - ``winget list --exact --id RedSalamanders.RedSalamander`` after installation
          - Cleanup with ``winget uninstall --exact --id RedSalamanders.RedSalamander --purge``

          ## ✅ Checklist

          - [x] Signed the [Contributor License Agreement](https://cla.opensource.microsoft.com)

          ## 📦 Manifest Checklist

          - [x] Checked that there aren't other open [pull requests](https://github.com/microsoft/winget-pkgs/pulls) for the same manifest update/change
          - [x] This PR only modifies one (1) manifest
          - [x] Validated the manifest with ``winget validate --manifest winget-manifest`` ([validation guide](https://github.com/microsoft/winget-pkgs/blob/master/doc/ValidationFailureGuide.md))
          - [x] Tested the manifest with ``winget install --manifest winget-manifest``
          - [x] Manifest conforms to the [1.12 schema](https://github.com/microsoft/winget-pkgs/tree/master/doc/manifest/schema/1.12.0)
          "@

          $updatePayload = @{
            title = $pullRequestTitle
            body = $pullRequestBody
          } | ConvertTo-Json
          $pullRequest = Invoke-RestMethod `
            -Method Patch `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $updatePayload `
            -Uri "https://api.github.com/repos/microsoft/winget-pkgs/pulls/$pullRequestNumber"

          if ($pullRequest.title -ne $pullRequestTitle -or
              [string]::IsNullOrWhiteSpace($pullRequest.html_url) -or
              $pullRequest.body -notmatch [regex]::Escape("## 🧪 Automated validation")) {
            throw "The Winget pull request was created, but its title/body update could not be verified."
          }

          "pull_request_url=$($pullRequest.html_url)" >> $env:GITHUB_OUTPUT
          Write-Host "Winget pull request: $($pullRequest.html_url)" -ForegroundColor Green

      - name: Summary
        if: success()
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          if ("${{ github.event_name }}" -eq "release" -or "${{ inputs.submit }}" -eq "true") {
            Write-Host "Successfully submitted RedSalamander $version portable ZIP to winget." -ForegroundColor Green
            Write-Host "Pull request: ${{ steps.winget_submission.outputs.pull_request_url }}"
            Write-Host "The winget community repository maintainers will review the PR."
          } else {
            Write-Host "Validated and install-tested RedSalamander $version winget manifest. Submission was skipped for this manual run." -ForegroundColor Green
          }
