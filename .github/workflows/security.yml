on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@f965c7945aff98dbab352623a0cfbe333e7f282f
    with:
      engine_ref: f965c7945aff98dbab352623a0cfbe333e7f282f
