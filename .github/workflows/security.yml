name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@e32cf9f9b29f4e817decb09e1be44be7fc1a94de
    with:
      engine_ref: e32cf9f9b29f4e817decb09e1be44be7fc1a94de
