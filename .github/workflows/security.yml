name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@7c2f428fa8d49791093bc782db65c7e0a3c97b18
    with:
      engine_ref: 7c2f428fa8d49791093bc782db65c7e0a3c97b18
