name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
