name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@4b9b7b66ce22c248eed578f22a8d9d82580223c5
    with:
      engine_ref: 4b9b7b66ce22c248eed578f22a8d9d82580223c5
