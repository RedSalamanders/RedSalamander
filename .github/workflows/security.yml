name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@c3c778cabd81dbf85b95f1dc4cec64b3b0eac12c
    with:
      engine_ref: c3c778cabd81dbf85b95f1dc4cec64b3b0eac12c
