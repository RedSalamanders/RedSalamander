name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@0573d4f3b294e3c3655349eb618ec7105b3d89b2
    with:
      engine_ref: 0573d4f3b294e3c3655349eb618ec7105b3d89b2
