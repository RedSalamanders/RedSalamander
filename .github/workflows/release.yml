name: Release

"on":
  workflow_dispatch:
    inputs:
      build_msix:
        description: "Also build MSIX (off by default)."
        required: false
        type: boolean
        default: false
      sign_msix:
        description: "Sign MSIX if certificate secrets are configured (only if build_msix=true)."
        required: false
        type: boolean
        default: true
      build_arm64:
        description: "Also build ARM64."
        required: false
        type: boolean
        default: true

permissions:
  contents: write

# ════════════════════════════════════════════════════════════════════════
# Job 1: Build (matrix: x64 + optional ARM64 — parallel via reusable workflow)
# ════════════════════════════════════════════════════════════════════════

jobs:
  version-info:
    runs-on: windows-latest
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . (Join-Path $env:GITHUB_WORKSPACE "Tools\Versioning.ps1")

          $versionContext = Get-RSVersionContext `
            -RepoRoot $env:GITHUB_WORKSPACE `
            -Configuration Release `
            -Platform x64 `
            -OfficialRelease

          $buildNumber = $versionContext.BuildNumber
          $version = $versionContext.PackagingVersion
          $tag = "v$version"

          Write-Host "Release version: $version"
          Write-Host "Release tag: $tag"
          Write-Host "Build number: $buildNumber"

          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "build_number=$buildNumber" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  build:
    needs: version-info
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson((github.event_name != 'workflow_dispatch' || inputs.build_arm64) && '["x64","ARM64"]' || '["x64"]') }}
    uses: ./.github/workflows/build-reusable.yml
    with:
      configuration: Release
      platform: ${{ matrix.platform }}
      build_number: ${{ needs.version-info.outputs.build_number }}
      official_release: true
      upload_build_output: true

  # ══════════════════════════════════════════════════════════════════════
  # Job 2: Package portable ZIP (no VS needed)
  # ══════════════════════════════════════════════════════════════════════

  package-portable:
    runs-on: windows-latest
    needs: [version-info, build]
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson((github.event_name != 'workflow_dispatch' || inputs.build_arm64) && '["x64","ARM64"]' || '["x64"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output-${{ matrix.platform }}
          path: .build/${{ matrix.platform }}/Release/

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zipScript = Join-Path $env:GITHUB_WORKSPACE "Installer\zip\build-zip.ps1"
          if (-not (Test-Path $zipScript)) { throw "ZIP build script not found at: $zipScript" }
          & $zipScript -Configuration Release -Platform "${{ matrix.platform }}" -BuildNumber "${{ needs.version-info.outputs.build_number }}"

      - name: Upload portable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-package-${{ matrix.platform }}
          path: .build/AppPackages/RedSalamander-${{ needs.version-info.outputs.release_version }}-${{ matrix.platform }}-Portable.zip
          if-no-files-found: error
          retention-days: 1

  # ══════════════════════════════════════════════════════════════════════
  # Job 3: Package MSIX (conditional — needs VS + Windows SDK)
  # ══════════════════════════════════════════════════════════════════════

  package-msix:
    runs-on: windows-latest
    needs: [version-info, build]
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson((github.event_name != 'workflow_dispatch' || inputs.build_arm64) && '["x64","ARM64"]' || '["x64"]') }}
    steps:
      - name: MSIX packaging disabled by policy
        if: ${{ !inputs.build_msix }}
        shell: pwsh
        run: Write-Host "MSIX was not requested; the required portable package matrix is unchanged."

      - name: Checkout
        if: ${{ inputs.build_msix }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build output
        if: ${{ inputs.build_msix }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output-${{ matrix.platform }}
          path: .build/${{ matrix.platform }}/Release/

      - name: Install VS 2026 Build Tools + VC++ + UWP workloads
        if: ${{ inputs.build_msix }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-ChocoInstall {
            param(
              [Parameter(Mandatory = $true)]
              [string] $PackageName,
              [Parameter(Mandatory = $true)]
              [string] $FailureMessage,
              [string[]] $ExtraArguments = @()
            )

            $oldNativeErrorPreference = $PSNativeCommandUseErrorActionPreference
            try {
              $PSNativeCommandUseErrorActionPreference = $false
              & choco install $PackageName -y --no-progress --ignore-detected-reboot --ignore-package-exit-codes @ExtraArguments
              $exitCode = $LASTEXITCODE
            } finally {
              $PSNativeCommandUseErrorActionPreference = $oldNativeErrorPreference
            }

            if ($exitCode -notin 0,3010) { throw "${FailureMessage}: $exitCode" }
            if ($exitCode -eq 3010) { Write-Warning "$PackageName requested a reboot; continuing because the Chocolatey install succeeded." }
            $global:LASTEXITCODE = 0
          }

          Invoke-ChocoInstall -PackageName visualstudio2026buildtools -FailureMessage "VS Build Tools install failed"

          $vcPackageParameters = "--includeRecommended"
          if ("${{ matrix.platform }}" -eq "ARM64") {
            $vcPackageParameters += " --add Microsoft.VisualStudio.Component.VC.Tools.ARM64"
          }

          Invoke-ChocoInstall -PackageName visualstudio2026-workload-vctools -FailureMessage "VC workload install failed" -ExtraArguments @("--package-parameters", $vcPackageParameters)
          Invoke-ChocoInstall -PackageName visualstudio2026-workload-universalbuildtools -FailureMessage "UWP workload install failed"

      - name: Select MSBuild (VS 2026)
        if: ${{ inputs.build_msix }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found: $vswhere"
          }

          $msbuild =
            (& $vswhere -latest -products * -prerelease -version '[18.0,19.0)' -find 'MSBuild\Current\Bin\MSBuild.exe' 2>$null) |
            Select-Object -First 1

          if (-not $msbuild) {
            $msbuild =
              (& $vswhere -latest -products * -prerelease -version '[18.0,19.0)' -find 'MSBuild\Current\Bin\amd64\MSBuild.exe' 2>$null) |
              Select-Object -First 1
          }

          if (-not $msbuild -or -not (Test-Path $msbuild)) {
            Write-Host "Installed Visual Studio instances:" -ForegroundColor Yellow
            & $vswhere -all -prerelease -products *
            throw "MSBuild for Visual Studio 2026 (18.x) not found after installation."
          }

          $msbuildDir = Split-Path -Parent $msbuild
          $msbuildDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "MSBUILD_EXE_PATH=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $msbuild -version

      - name: Generate MSIX assets
        if: ${{ inputs.build_msix }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & (Join-Path $env:GITHUB_WORKSPACE "Installer\msix\GenerateAssets.ps1")

      - name: Update MSIX version
        if: ${{ inputs.build_msix }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & (Join-Path $env:GITHUB_WORKSPACE "Installer\msix\UpdateManifestVersion.ps1") `
            -Version "${{ needs.version-info.outputs.release_version }}" `
            -Platform "${{ matrix.platform }}"

      - name: Build MSIX package
        if: ${{ inputs.build_msix }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $platform = "${{ matrix.platform }}"
          $wapproj = Join-Path $env:GITHUB_WORKSPACE "Installer\msix\RedSalamanderInstaller.wapproj"
          $solutionDir = $env:GITHUB_WORKSPACE.TrimEnd('\') + '\'

          # Resolve TargetPlatformVersion from installed Windows SDK
          $uapRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\DesignTime\CommonConfiguration\Neutral\UAP"
          $installed = Get-ChildItem -Path $uapRoot -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
              Sort-Object { [version]$_.Name } -Descending |
              Select-Object -First 1

          if (-not $installed) {
            throw "Windows SDK with UAP props not found."
          }
          $targetPlatformVersion = $installed.Name

          $msixParams = @(
            $wapproj
            "/t:Build"
            "/p:Configuration=Release"
            "/p:Platform=$platform"
            "/p:TargetPlatformVersion=$targetPlatformVersion"
            "/p:SolutionDir=$solutionDir"
            "/p:AppxPackageSigningEnabled=false"
            "/p:GenerateAppInstallerFile=false"
            "/p:AppxBundle=Never"
            "/v:minimal"
            "/nologo"
          )

          MSBuild.exe @msixParams
          if ($LASTEXITCODE -ne 0) { throw "MSIX build failed with exit code $LASTEXITCODE" }

      - name: Sign MSIX
        if: ${{ inputs.build_msix && inputs.sign_msix }}
        shell: pwsh
        env:
          MSIX_SIGNING_CERT: ${{ secrets.MSIX_SIGNING_CERT }}
          MSIX_SIGNING_PASSWORD: ${{ secrets.MSIX_SIGNING_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:MSIX_SIGNING_CERT) -or [string]::IsNullOrWhiteSpace($env:MSIX_SIGNING_PASSWORD)) {
            Write-Host "MSIX signing secrets not configured; skipping signing step."
            exit 0
          }

          $certPath = Join-Path $env:RUNNER_TEMP "msix.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:MSIX_SIGNING_CERT))

          $appPackages = Join-Path $env:GITHUB_WORKSPACE ".build\AppPackages"
          $msixFiles = Get-ChildItem -Path $appPackages -Filter *.msix -Recurse -ErrorAction SilentlyContinue
          if (-not $msixFiles -or $msixFiles.Count -eq 0) { throw "No MSIX found to sign." }

          $signtoolPath = $null
          $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if ($signtool) {
            $signtoolPath = $signtool.Source
          } else {
            $kitsBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
            $versionDirs =
              Get-ChildItem -Path $kitsBin -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' } |
              Sort-Object -Property Name -Descending

            foreach ($dir in $versionDirs) {
              $candidate = Join-Path $dir.FullName "x64\signtool.exe"
              if (Test-Path $candidate) {
                $signtoolPath = $candidate
                break
              }
            }
          }

          if (-not $signtoolPath) {
            throw "signtool.exe not found (Windows SDK missing on runner)."
          }

          foreach ($msix in $msixFiles) {
            & $signtoolPath sign /fd SHA256 /f $certPath /p $env:MSIX_SIGNING_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $msix.FullName
            if ($LASTEXITCODE -ne 0) { throw "MSIX signing failed with exit code $LASTEXITCODE for $($msix.FullName)." }
          }

      - name: Normalize MSIX package name
        if: ${{ inputs.build_msix }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $appPackages = Join-Path $env:GITHUB_WORKSPACE ".build\AppPackages"
          $msixFiles = @(Get-ChildItem -Path $appPackages -Filter *.msix -File -Recurse -ErrorAction SilentlyContinue)
          if ($msixFiles.Count -ne 1) {
            throw "Expected exactly one MSIX for ${{ matrix.platform }}; found $($msixFiles.Count)."
          }

          $destination = Join-Path $appPackages "RedSalamander-${{ needs.version-info.outputs.release_version }}-${{ matrix.platform }}.msix"
          if ($msixFiles[0].FullName -cne $destination) {
            Move-Item -LiteralPath $msixFiles[0].FullName -Destination $destination
          }

      - name: Upload MSIX package
        if: ${{ inputs.build_msix }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msix-package-${{ matrix.platform }}
          path: .build/AppPackages/RedSalamander-${{ needs.version-info.outputs.release_version }}-${{ matrix.platform }}.msix
          if-no-files-found: error
          retention-days: 1

  # ══════════════════════════════════════════════════════════════════════
  # Job 4: Release — download all artifacts, create GitHub Release
  # ══════════════════════════════════════════════════════════════════════

  release:
    runs-on: windows-latest
    needs: [version-info, package-portable, package-msix]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download portable packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: portable-package-*
          path: artifacts
          merge-multiple: true

      - name: Download MSIX packages
        if: ${{ inputs.build_msix }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: msix-package-*
          path: artifacts
          merge-multiple: true

      - name: Verify exact release artifact matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . (Join-Path $env:GITHUB_WORKSPACE "Tools\ReleaseArtifactPolicy.ps1")

          $artifacts = @(Assert-RSReleaseArtifacts `
            -ArtifactsRoot (Join-Path $env:GITHUB_WORKSPACE "artifacts") `
            -ReleaseVersion "${{ needs.version-info.outputs.release_version }}" `
            -BuildArm64 ([bool]::Parse("${{ inputs.build_arm64 }}")) `
            -BuildMsix ([bool]::Parse("${{ inputs.build_msix }}")))

          Write-Host "Validated release artifacts:"
          $artifacts | ForEach-Object { Write-Host "  $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)" }

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . (Join-Path $env:GITHUB_WORKSPACE "Tools\ReleaseArtifactPolicy.ps1")

          $policy = @{
            ArtifactsRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts"
            ReleaseVersion = "${{ needs.version-info.outputs.release_version }}"
            BuildArm64 = [bool]::Parse("${{ inputs.build_arm64 }}")
            BuildMsix = [bool]::Parse("${{ inputs.build_msix }}")
          }
          New-RSReleaseChecksumFile @policy | Out-Null
          Assert-RSReleaseChecksumFile @policy | Out-Null
          Get-Content -LiteralPath (Join-Path $policy.ArtifactsRoot "checksums.sha256") | ForEach-Object { Write-Host "  $_" }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.version-info.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            artifacts/*.zip
            artifacts/*.sha256

      - name: Upload MSIX to release
        if: ${{ inputs.build_msix }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.version-info.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: artifacts/*.msix
