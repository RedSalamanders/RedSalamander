name: Manual Native Suite
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Explicit native qualification profile
        type: choice
        options: [Debug, Release, ASan Debug]
        default: Release
permissions:
  contents: read
concurrency:
  group: explicit-native-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  qualification:
    uses: RedSalamanders/.github/.github/workflows/qualification.yml@633e127f13408d294bb6bdd338bfceac721b109a
    with:
      engine_ref: 633e127f13408d294bb6bdd338bfceac721b109a
      configuration: ${{ inputs.configuration }}
      scope: Full
