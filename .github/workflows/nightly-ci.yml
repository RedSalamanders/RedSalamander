name: Manual Native Suite
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Explicit native qualification profile
        type: choice
        options: [Debug, Release, ASan Debug]
        default: Release
permissions:
  contents: read
concurrency:
  group: explicit-native-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  qualification:
    uses: RedSalamanders/.github/.github/workflows/qualification.yml@c3c778cabd81dbf85b95f1dc4cec64b3b0eac12c
    with:
      engine_ref: c3c778cabd81dbf85b95f1dc4cec64b3b0eac12c
      configuration: ${{ inputs.configuration }}
      scope: Full
