name: Manual Native Suite
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Explicit native qualification profile
        type: choice
        options: [Debug, Release, ASan Debug]
        default: Release
permissions:
  contents: read
concurrency:
  group: explicit-native-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  qualification:
    uses: RedSalamanders/.github/.github/workflows/qualification.yml@fcf723f54140eabb69ef5017c32c971deb117ada
    with:
      engine_ref: fcf723f54140eabb69ef5017c32c971deb117ada
      configuration: ${{ inputs.configuration }}
      scope: Full
