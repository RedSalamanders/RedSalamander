name: Manual Native Suite
run-name: "Manual native ${{ inputs.scope }} (${{ inputs.configuration }})"
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Explicit native qualification profile
        type: choice
        options: [Debug, Release, ASan Debug]
        default: Release
      scope:
        description: Full qualification or an explicitly selected diagnostic
        type: choice
        options: [Full, CommandsHandoff, FileOpsVolumes, ViewerSpaceCapture, R0ePaired, DesktopProbe]
        default: Full
      baseline_ref:
        description: Full immutable baseline commit SHA, required only for R0ePaired
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: explicit-native-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  qualification:
    uses: RedSalamanders/.github/.github/workflows/qualification.yml@0573d4f3b294e3c3655349eb618ec7105b3d89b2
    with:
      engine_ref: 0573d4f3b294e3c3655349eb618ec7105b3d89b2
      configuration: ${{ inputs.configuration }}
      scope: ${{ inputs.scope }}
