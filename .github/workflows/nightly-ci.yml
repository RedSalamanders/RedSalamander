# PRIVATE, TEMPORARY API CONTROL. No application build, image capture or qualification receipt.
name: Manual Native Suite
run-name: "DIAGNOSTIC ONLY WGC admission (${{ inputs.configuration }})"
on:
  workflow_dispatch:
    inputs:
      configuration:
        type: choice
        options: [Release]
        default: Release
      scope:
        type: choice
        options: [DesktopProbe]
        default: DesktopProbe
permissions:
  contents: read
concurrency:
  group: wgc-admission-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  metadata:
    name: WGC metadata only (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025-vs2026
            testRoot: 'D:\RedSalamander.Perf'
          - arch: ARM64
            runner: windows-11-vs2026-arm
            testRoot: 'C:\RedSalamander.Perf'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Query owned-window admission and active desktop through the canonical lease
        shell: pwsh
        run: ./.ci/WgcAdmissionProbe.ps1 -TestRoot '${{ matrix.testRoot }}'
      - name: Preserve metadata evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wgc-admission-${{ matrix.arch }}
          path: ${{ matrix.testRoot }}/runs/**/wgc-admission.json
          if-no-files-found: error
