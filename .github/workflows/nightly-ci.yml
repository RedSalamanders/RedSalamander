name: Manual Native Suite
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Explicit native qualification profile
        type: choice
        options: [Debug, Release, ASan Debug]
        default: Release
permissions:
  contents: read
concurrency:
  group: explicit-native-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  qualification:
    uses: RedSalamanders/.github/.github/workflows/qualification.yml@395063c69b0982097cd925abed82887244293793
    with:
      engine_ref: 395063c69b0982097cd925abed82887244293793
      configuration: ${{ inputs.configuration }}
      scope: Full
