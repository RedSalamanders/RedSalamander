name: Manual Native Suite
run-name: "Manual native ${{ inputs.scope }} (${{ inputs.configuration }})"
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Explicit native qualification profile
        type: choice
        options: [Debug, Release, ASan Debug]
        default: Release
      scope:
        description: Full qualification or an explicitly selected diagnostic
        type: choice
        options: [Full, CommandsHandoff, CommandsUiAttribution, FileOpsVolumes, ViewerSpaceCapture, R0ePaired, DesktopProbe]
        default: Full
      platform:
        description: Native hosted architectures for this explicit run
        type: choice
        options: [All, x64, ARM64]
        default: All
      baseline_ref:
        description: Full immutable baseline commit SHA, required only for R0ePaired
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: explicit-native-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  qualification:
    uses: RedSalamanders/.github/.github/workflows/qualification.yml@a094b2ea66fc6fd7a8933488a71dacda262903a4
    with:
      engine_ref: a094b2ea66fc6fd7a8933488a71dacda262903a4
      configuration: ${{ inputs.configuration }}
      scope: ${{ inputs.scope }}
      platform: ${{ inputs.platform }}
