# PRIVATE, TEMPORARY DIAGNOSTICS. Filtered UI mode builds and captures; it never provides Full qualification.
name: Manual Native Suite
run-name: "DIAGNOSTIC ONLY ${{ inputs.scope }} (${{ inputs.configuration }})"
on:
  workflow_dispatch:
    inputs:
      configuration:
        type: choice
        options: [Release]
        default: Release
      scope:
        type: choice
        options: [DesktopProbe, DesktopIdentity, ApprovedCloseIdentity, ApprovedCurrentUi, ApprovedCanonicalAdmission, ApprovedDesktopAttachmentPair, BoundaryChildRoundTrip]
        default: DesktopProbe
      dismiss_hosted_account_surface:
        description: Explicit owner-approved exception for the stock hosted ARM64 account window
        type: boolean
        default: false
      dismiss_hosted_search_surface:
        description: Separate explicit owner approval for the exact stock hosted ARM64 Search flyout
        type: boolean
        default: false
      dismiss_hosted_wsl_startup:
        description: Separate approval for the exact hosted WSL update startup console in private admission diagnostics
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: wgc-admission-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  metadata:
    if: inputs.scope != 'ApprovedCloseIdentity' && inputs.scope != 'ApprovedCurrentUi' && inputs.scope != 'ApprovedCanonicalAdmission' && inputs.scope != 'ApprovedDesktopAttachmentPair' && inputs.scope != 'BoundaryChildRoundTrip'
    name: Private desktop diagnostic (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025-vs2026
            testRoot: 'D:\RedSalamander.Perf'
          - arch: ARM64
            runner: windows-11-vs2026-arm
            testRoot: 'C:\RedSalamander.Perf'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Query owned-window admission and active desktop through the canonical lease
        shell: pwsh
        run: ./.ci/WgcAdmissionProbe.ps1 -TestRoot '${{ matrix.testRoot }}' -DismissHostedAccountSurface:('${{ inputs.dismiss_hosted_account_surface }}' -ceq 'true' -and '${{ matrix.arch }}' -ceq 'ARM64')
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.scope != 'DesktopIdentity'
        with:
          repository: microsoft/wil
          ref: cbf677fb0a942557d08fd129f4c106a76247b2ec
          path: .build/probe-wil
          persist-credentials: false
      - name: Build private canonical foreground diagnostic
        if: inputs.scope != 'DesktopIdentity'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation=(& $vswhere -latest -prerelease -products '*' -requires Microsoft.Component.MSBuild -property installationPath).Trim()
          if (-not $installation) { throw 'VS installation unavailable' }
          $hostArch=if ($env:PROCESSOR_ARCHITECTURE -ceq 'ARM64') { 'arm64' } else { 'amd64' }
          & (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch '${{ matrix.arch }}' -HostArch $hostArch -SkipAutomaticLocation
          $output=Join-Path $env:GITHUB_WORKSPACE '.build/private-foreground-probe/${{ matrix.arch }}'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          & cl.exe /nologo /std:c++latest /EHsc /MD /O2 /Wall /WX- /external:W0 /external:anglebrackets /DENABLE_TESTS /DUNICODE /D_UNICODE /D_CRT_SECURE_NO_WARNINGS /I Common /I Tests/TestSupport /external:I .build/probe-wil/include /Fo"$output/" /Fe"$output/HostedForegroundProbe.exe" .ci/HostedForegroundProbe.cpp /link user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Private diagnostic build failed' }
      - name: Run private canonical foreground diagnostic under the existing desktop lease
        if: inputs.scope != 'DesktopIdentity'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_WORKSPACE
          $env:REDSALAMANDER_TEST_ROOT='${{ matrix.testRoot }}'
          Import-Module ./Tools/Modules/Testing/TestSandbox.psm1
          $scratch=New-RSTestSandboxScratchDirectory -RepoRoot $repo -Harness review-tools -Case private-native-foreground
          $env:TEMP=$scratch; $env:TMP=$scratch
          $tokens=$null; $parseErrors=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile((Join-Path $repo 'Tools/Run-AllTests.ps1'),[ref]$tokens,[ref]$parseErrors)
          if ($parseErrors.Count) { throw 'Canonical runner parse failed' }
          $definition=@($ast.FindAll({param($n) $n -is [Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -ceq 'Invoke-RSInteractiveDesktopOperation'},$false))
          if ($definition.Count -ne 1) { throw 'Expected exact canonical desktop lease' }
          . ([scriptblock]::Create($definition[0].Extent.Text))
          [Environment]::SetEnvironmentVariable('REDSALAMANDER_HOSTED_TEST_DESKTOP',$null,'Process')
          Invoke-RSInteractiveDesktopOperation -RequiresInteractiveDesktop $true -Operation {
            & (Join-Path $repo '.build/private-foreground-probe/${{ matrix.arch }}/HostedForegroundProbe.exe') | Tee-Object -FilePath (Join-Path $scratch 'native-foreground.txt')
            if ($LASTEXITCODE -ne 0) { throw 'Private diagnostic execution failed' }
          }
      - name: Preserve metadata evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wgc-admission-${{ matrix.arch }}
          path: |
            ${{ matrix.testRoot }}/runs/**/wgc-admission.json
            ${{ matrix.testRoot }}/runs/**/native-foreground.txt
            ${{ matrix.testRoot }}/runs/**/account-dismissal-*.json
          if-no-files-found: error
  approved-close-identity:
    if: inputs.scope == 'ApprovedCloseIdentity'
    name: Private approved ARM64 close and metadata
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 15
    steps:
      - name: Require explicit account-window authorization
        shell: pwsh
        if: inputs.dismiss_hosted_account_surface != true
        run: throw 'ApprovedCloseIdentity requires the explicit account-window authorization input.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bootstrap
          persist-credentials: false
          fetch-depth: 0
      - name: Close only the approved foreground account surface, then query metadata in a fresh process
        shell: pwsh
        env:
          APPROVED_ACCOUNT_CLOSE: ${{ inputs.dismiss_hosted_account_surface }}
          APPROVED_SEARCH_CLOSE: ${{ inputs.dismiss_hosted_search_surface }}
        run: ./bootstrap/.ci/Invoke-ApprovedCloseIdentity.ps1 -RepoRoot "$env:GITHUB_WORKSPACE/bootstrap" -ApproveAccountClose:($env:APPROVED_ACCOUNT_CLOSE -ceq 'true') -ApproveSearchClose:($env:APPROVED_SEARCH_CLOSE -ceq 'true')
      - name: Retain bounded job status even if preflight fails
        if: always()
        shell: pwsh
        run: |
          @{ scope='ApprovedCloseIdentity'; job_status='${{ job.status }}'; repository_coverage='NOT_EVALUATED' } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'approved-close-identity-preflight.json') -Encoding utf8
      - name: Retain only close and foreground metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approved-close-identity-ARM64
          path: C:/RedSalamander.Perf/evidence/approved-close-identity/
          if-no-files-found: warn
      - name: Retain close diagnostic preflight status separately
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approved-close-identity-preflight-ARM64
          path: ${{ runner.temp }}/approved-close-identity-preflight.json
          if-no-files-found: error
  approved-canonical-admission:
    if: inputs.scope == 'ApprovedCanonicalAdmission'
    name: Private canonical ARM64 admission only
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 15
    steps:
      - name: Require both approved stock-surface exceptions
        if: inputs.dismiss_hosted_account_surface != true || inputs.dismiss_hosted_search_surface != true
        shell: pwsh
        run: throw 'ApprovedCanonicalAdmission requires both explicit authorizations.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bootstrap
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fb9fb829fd7a52c03ae83ea85d5434dc3e417529
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Run canonical fixture admission under interactive lease
        shell: pwsh
        env:
          APPROVED_ACCOUNT_CLOSE: ${{ inputs.dismiss_hosted_account_surface }}
          APPROVED_SEARCH_CLOSE: ${{ inputs.dismiss_hosted_search_surface }}
        run: ./bootstrap/.ci/Invoke-ApprovedCanonicalAdmission.ps1 -CandidateRoot "$env:GITHUB_WORKSPACE/candidate" -BootstrapRoot "$env:GITHUB_WORKSPACE/bootstrap" -ApproveAccountClose:($env:APPROVED_ACCOUNT_CLOSE -ceq 'true') -ApproveSearchClose:($env:APPROVED_SEARCH_CLOSE -ceq 'true') -ApproveWslStartupClose:('${{ inputs.dismiss_hosted_wsl_startup }}' -ceq 'true')
      - name: Retain bounded preflight status
        if: always()
        shell: pwsh
        run: |
          @{ scope='ApprovedCanonicalAdmission'; job_status='${{ job.status }}'; repository_coverage='NOT_EVALUATED' } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'approved-canonical-admission-preflight.json') -Encoding utf8
      - name: Retain admission and stock preparation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approved-canonical-admission-ARM64
          path: C:/RedSalamander.Perf/evidence/
          if-no-files-found: warn
      - name: Retain preflight status separately
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approved-canonical-admission-preflight-ARM64
          path: ${{ runner.temp }}/approved-canonical-admission-preflight.json
          if-no-files-found: error
  boundary-child-roundtrip:
    if: inputs.scope == 'BoundaryChildRoundTrip'
    name: Private owned child boundary round trip
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 15
    steps:
      - name: Require both approved stock-surface exceptions
        if: inputs.dismiss_hosted_account_surface != true || inputs.dismiss_hosted_search_surface != true
        shell: pwsh
        run: throw 'ApprovedCanonicalAdmission requires both explicit authorizations.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bootstrap
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fb9fb829fd7a52c03ae83ea85d5434dc3e417529
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/wil
          ref: cbf677fb0a942557d08fd129f4c106a76247b2ec
          path: .build/probe-wil
          persist-credentials: false
      - name: Compile private boundary child
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation=(& $vswhere -latest -prerelease -products '*' -requires Microsoft.Component.MSBuild -property installationPath).Trim()
          if (-not $installation) { throw 'VS installation unavailable' }
          & (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch ARM64 -HostArch arm64 -SkipAutomaticLocation
          $output=Join-Path $env:GITHUB_WORKSPACE '.build/private-boundary-child'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          & cl.exe /nologo /std:c++latest /EHsc /MD /O2 /Wall /WX- /external:W0 /external:anglebrackets /DENABLE_TESTS /DUNICODE /D_UNICODE /D_CRT_SECURE_NO_WARNINGS /I candidate/Common /I candidate/Tests/TestSupport /external:I .build/probe-wil/include /Fo"$output/" /Fe"$output/HostedForegroundProbe.exe" bootstrap/.ci/HostedForegroundProbe.cpp /link user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Private diagnostic build failed' }
      - name: Run canonical fixture admission under interactive lease
        shell: pwsh
        env:
          APPROVED_ACCOUNT_CLOSE: ${{ inputs.dismiss_hosted_account_surface }}
          APPROVED_SEARCH_CLOSE: ${{ inputs.dismiss_hosted_search_surface }}
        run: ./bootstrap/.ci/Invoke-ApprovedCanonicalAdmission.ps1 -CandidateRoot "$env:GITHUB_WORKSPACE/candidate" -BootstrapRoot "$env:GITHUB_WORKSPACE/bootstrap" -ApproveAccountClose:($env:APPROVED_ACCOUNT_CLOSE -ceq 'true') -ApproveSearchClose:($env:APPROVED_SEARCH_CLOSE -ceq 'true') -ApproveWslStartupClose:('${{ inputs.dismiss_hosted_wsl_startup }}' -ceq 'true') -BoundaryChildProbe "$env:GITHUB_WORKSPACE/.build/private-boundary-child/HostedForegroundProbe.exe"
      - name: Retain bounded preflight status
        if: always()
        shell: pwsh
        run: |
          @{ scope='ApprovedCanonicalAdmission'; job_status='${{ job.status }}'; repository_coverage='NOT_EVALUATED' } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'approved-canonical-admission-preflight.json') -Encoding utf8
      - name: Retain admission and stock preparation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boundary-child-roundtrip-ARM64
          path: C:/RedSalamander.Perf/evidence/
          if-no-files-found: warn
      - name: Retain preflight status separately
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boundary-child-roundtrip-preflight-ARM64
          path: ${{ runner.temp }}/approved-canonical-admission-preflight.json
          if-no-files-found: error
  approved-desktop-attachment-pair:
    if: inputs.scope == 'ApprovedDesktopAttachmentPair'
    name: Private transformed fixture attachment pair
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    steps:
      - name: Require both approved stock-surface exceptions
        if: inputs.dismiss_hosted_account_surface != true || inputs.dismiss_hosted_search_surface != true
        shell: pwsh
        run: throw 'Both explicit authorizations are required.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bootstrap
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3871a05da6109106d26b53ede1937e5ef29ec341
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Explicit attachment, one attempt
        id: explicit
        shell: pwsh
        env:
          APPROVED_ACCOUNT_CLOSE: ${{ inputs.dismiss_hosted_account_surface }}
          APPROVED_SEARCH_CLOSE: ${{ inputs.dismiss_hosted_search_surface }}
          APPROVED_WSL_STARTUP_CLOSE: ${{ inputs.dismiss_hosted_wsl_startup }}
        run: ./bootstrap/.ci/Invoke-ApprovedCanonicalAdmission.ps1 -CandidateRoot "$env:GITHUB_WORKSPACE/candidate" -BootstrapRoot "$env:GITHUB_WORKSPACE/bootstrap" -ApproveAccountClose:($env:APPROVED_ACCOUNT_CLOSE -ceq 'true') -ApproveSearchClose:($env:APPROVED_SEARCH_CLOSE -ceq 'true') -ApproveWslStartupClose:($env:APPROVED_WSL_STARTUP_CLOSE -ceq 'true') -AttachmentVariant Explicit
      - name: Inherited desktop, one attempt
        if: always() && steps.explicit.outcome != 'skipped'
        shell: pwsh
        env:
          APPROVED_ACCOUNT_CLOSE: ${{ inputs.dismiss_hosted_account_surface }}
          APPROVED_SEARCH_CLOSE: ${{ inputs.dismiss_hosted_search_surface }}
          APPROVED_WSL_STARTUP_CLOSE: ${{ inputs.dismiss_hosted_wsl_startup }}
        run: ./bootstrap/.ci/Invoke-ApprovedCanonicalAdmission.ps1 -CandidateRoot "$env:GITHUB_WORKSPACE/candidate" -BootstrapRoot "$env:GITHUB_WORKSPACE/bootstrap" -ApproveAccountClose:($env:APPROVED_ACCOUNT_CLOSE -ceq 'true') -ApproveSearchClose:($env:APPROVED_SEARCH_CLOSE -ceq 'true') -ApproveWslStartupClose:($env:APPROVED_WSL_STARTUP_CLOSE -ceq 'true') -AttachmentVariant Inherited
      - name: Retain bounded preflight status
        if: always()
        shell: pwsh
        run: |
          @{ scope='ApprovedDesktopAttachmentPair'; job_status='${{ job.status }}'; repository_coverage='NOT_EVALUATED' } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'desktop-attachment-pair-preflight.json') -Encoding utf8
      - name: Retain both fixture attempts and stock evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-attachment-pair-ARM64
          path: C:/RedSalamander.Perf/evidence/
          if-no-files-found: warn
      - name: Retain preflight separately
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-attachment-pair-preflight-ARM64
          path: ${{ runner.temp }}/desktop-attachment-pair-preflight.json
          if-no-files-found: error
  approved-current-ui:
    if: inputs.scope == 'ApprovedCurrentUi'
    name: Private approved ARM64 UI (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: PR200
            head: ab5f142c3ca54d4c2c559a2654f8a2e8df4229eb
          - label: PR201
            head: efd597e40e26d17bfcd9dbb32fa8438ff757873b
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 240
    steps:
      - name: Require both separate explicit authorizations
        if: inputs.dismiss_hosted_account_surface != true || inputs.dismiss_hosted_search_surface != true
        shell: pwsh
        run: throw 'ApprovedCurrentUi requires separate explicit account and Search authorization inputs.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bootstrap
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.head }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - uses: ./candidate/.github/actions/setup-msvc
        with:
          platform: ARM64
      - name: Build and run exact filtered diagnostics
        shell: pwsh
        env:
          APPROVED_CANDIDATE_HEAD: ${{ matrix.head }}
          APPROVED_CANDIDATE_LABEL: ${{ matrix.label }}
          APPROVED_ACCOUNT_CLOSE: ${{ inputs.dismiss_hosted_account_surface }}
          APPROVED_SEARCH_CLOSE: ${{ inputs.dismiss_hosted_search_surface }}
        run: ./bootstrap/.ci/Invoke-ApprovedCurrentUi.ps1 -CandidateRoot "$env:GITHUB_WORKSPACE/candidate" -BootstrapRoot "$env:GITHUB_WORKSPACE/bootstrap" -ExpectedHead $env:APPROVED_CANDIDATE_HEAD -Label $env:APPROVED_CANDIDATE_LABEL -ApproveAccountClose:($env:APPROVED_ACCOUNT_CLOSE -ceq 'true') -ApproveSearchClose:($env:APPROVED_SEARCH_CLOSE -ceq 'true')
      - name: Retain bounded job status even if preflight fails
        if: always()
        shell: pwsh
        run: |
          @{ scope='ApprovedCurrentUi'; candidate='${{ matrix.label }}'; head='${{ matrix.head }}'; job_status='${{ job.status }}'; repository_coverage='NOT_EVALUATED' } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'approved-current-ui-preflight.json') -Encoding utf8
      - name: Retain private diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approved-current-ui-${{ matrix.label }}-ARM64
          path: C:/RedSalamander.Perf/evidence/approved-current-ui/
          if-no-files-found: warn
      - name: Retain preflight status separately
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approved-current-ui-preflight-${{ matrix.label }}-ARM64
          path: ${{ runner.temp }}/approved-current-ui-preflight.json
          if-no-files-found: error
