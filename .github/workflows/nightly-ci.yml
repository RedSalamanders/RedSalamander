name: Manual Native Suite
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Explicit native qualification profile
        type: choice
        options: [Debug, Release, ASan Debug]
        default: Release
permissions:
  contents: read
concurrency:
  group: explicit-native-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  qualification:
    uses: RedSalamanders/.github/.github/workflows/qualification.yml@19710a8aeac979a82e83bec82e8b866cee3d3deb
    with:
      engine_ref: 19710a8aeac979a82e83bec82e8b866cee3d3deb
      configuration: ${{ inputs.configuration }}
      scope: Full
