name: Manual Native Suite
run-name: "Manual native ${{ inputs.scope }} (${{ inputs.configuration }})"
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Explicit native qualification profile
        type: choice
        options: [Debug, Release, ASan Debug]
        default: Release
      scope:
        description: Full qualification or one explicitly filtered diagnostic
        type: choice
        options: [Full, CommandsHandoff, FileOpsVolumes]
        default: Full
permissions:
  contents: read
concurrency:
  group: explicit-native-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  qualification:
    uses: RedSalamanders/.github/.github/workflows/qualification.yml@e32cf9f9b29f4e817decb09e1be44be7fc1a94de
    with:
      engine_ref: e32cf9f9b29f4e817decb09e1be44be7fc1a94de
      configuration: ${{ inputs.configuration }}
      scope: ${{ inputs.scope }}
