name: Build (reusable)

"on":
  workflow_call:
    inputs:
      configuration:
        type: string
        default: Release
      platform:
        type: string
        default: x64
      build_number:
        type: string
        default: ""
      official_release:
        type: boolean
        default: false
      upload_build_output:
        type: boolean
        default: false
      run_asan_plugin_contracts:
        type: boolean
        default: false
    outputs:
      portable_attestation_id:
        description: Content identity for the uploaded same-workflow build attestation.
        value: ${{ jobs.build.outputs.portable_attestation_id }}
      portable_toolchain_identity_digest:
        description: Toolchain identity bound by the uploaded build attestation.
        value: ${{ jobs.build.outputs.portable_toolchain_identity_digest }}

jobs:
  build:
    outputs:
      portable_attestation_id: ${{ steps.portable_attestation.outputs.attestation_id }}
      portable_toolchain_identity_digest: ${{ steps.portable_attestation.outputs.toolchain_identity_digest }}
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}\.build\vcpkg_installed\${{ inputs.platform == 'ARM64' && 'arm64' || 'x64' }}
      VCPKG_DEFAULT_TRIPLET: ${{ inputs.platform == 'ARM64' && 'arm64-windows' || 'x64-windows' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ── Setup toolchain ──────────────────────────────────────────────

      - name: Install VS 2026 Build Tools + VC++ workload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-ChocoInstall {
            param(
              [Parameter(Mandatory = $true)]
              [string] $PackageName,
              [Parameter(Mandatory = $true)]
              [string] $FailureMessage,
              [Parameter(Mandatory = $true)]
              [string] $PackageVersion,
              [string[]] $ExtraArguments = @()
            )

            $oldNativeErrorPreference = $PSNativeCommandUseErrorActionPreference
            try {
              $PSNativeCommandUseErrorActionPreference = $false
              & choco install $PackageName --version $PackageVersion -y --no-progress --ignore-detected-reboot --ignore-package-exit-codes @ExtraArguments
              $exitCode = $LASTEXITCODE
            } finally {
              $PSNativeCommandUseErrorActionPreference = $oldNativeErrorPreference
            }

            if ($exitCode -notin 0,3010) { throw "${FailureMessage}: $exitCode" }
            if ($exitCode -eq 3010) { Write-Warning "$PackageName requested a reboot; continuing because the Chocolatey install succeeded." }
            $global:LASTEXITCODE = 0
          }

          Invoke-ChocoInstall -PackageName visualstudio2026buildtools -PackageVersion 118.8.1 -FailureMessage "VS Build Tools install failed"

          $vcPackageParameters = "--includeRecommended"
          if ("${{ inputs.platform }}" -eq "ARM64") {
            $vcPackageParameters += " --add Microsoft.VisualStudio.Component.VC.Tools.ARM64"
          }

          Invoke-ChocoInstall -PackageName visualstudio2026-workload-vctools -PackageVersion 1.0.0 -FailureMessage "VC workload install failed" -ExtraArguments @("--package-parameters", $vcPackageParameters)

      - name: Verify ARM64 MSVC target tools
        if: ${{ inputs.platform == 'ARM64' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found: $vswhere"
          }

          $installPath =
            (& $vswhere -latest -products * -prerelease -version '[18.0,19.0)' -property installationPath 2>$null) |
            Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($installPath) -or -not (Test-Path $installPath)) {
            Write-Host "Installed Visual Studio instances:" -ForegroundColor Yellow
            & $vswhere -all -prerelease -products *
            throw "Visual Studio 2026 Build Tools install path not found."
          }

          $componentId = "Microsoft.VisualStudio.Component.VC.Tools.ARM64"
          $arm64InstallPath =
            (& $vswhere -latest -products * -prerelease -version '[18.0,19.0)' -requires $componentId -property installationPath 2>$null) |
            Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($arm64InstallPath)) {
            Write-Host "Installed Visual Studio instances:" -ForegroundColor Yellow
            & $vswhere -all -prerelease -products *
            throw "Visual Studio 2026 Build Tools does not report required component: $componentId."
          }
          $installPath = $arm64InstallPath

          $vcToolsRoot = Join-Path $installPath "VC\Tools\MSVC"
          $arm64Compiler =
            Get-ChildItem -Path $vcToolsRoot -Directory -ErrorAction SilentlyContinue |
            Sort-Object -Property Name -Descending |
            ForEach-Object { Join-Path $_.FullName "bin\Hostx64\arm64\cl.exe" } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $arm64Compiler) {
            throw "ARM64 MSVC compiler not found under $vcToolsRoot after installing $componentId."
          }

          Write-Host "ARM64 compiler: $arm64Compiler"

      - name: Select MSBuild (VS 2026)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found: $vswhere"
          }

          $msbuild =
            (& $vswhere -latest -products * -prerelease -version '[18.0,19.0)' -find 'MSBuild\Current\Bin\MSBuild.exe' 2>$null) |
            Select-Object -First 1

          if (-not $msbuild) {
            $msbuild =
              (& $vswhere -latest -products * -prerelease -version '[18.0,19.0)' -find 'MSBuild\Current\Bin\amd64\MSBuild.exe' 2>$null) |
              Select-Object -First 1
          }

          if (-not $msbuild -or -not (Test-Path $msbuild)) {
            Write-Host "Installed Visual Studio instances:" -ForegroundColor Yellow
            & $vswhere -all -prerelease -products *
            throw "MSBuild for Visual Studio 2026 (18.x) not found after installation."
          }

          $msbuildDir = Split-Path -Parent $msbuild
          $msbuildDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "MSBUILD_EXE_PATH=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $msbuild -version

      - name: Resolve canonical toolchain identity
        id: toolchain_identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module .\Tools\Modules\Build\BuildEvidence.psm1 -Force
          $identity = Get-RSBuildToolchainIdentity `
            -RepoRoot $env:GITHUB_WORKSPACE `
            -MSBuildPath $env:MSBUILD_EXE_PATH `
            -Platform "${{ inputs.platform }}" `
            -Configuration "${{ inputs.configuration }}"
          "digest=$($identity.Digest)" >> $env:GITHUB_OUTPUT
          Write-Host "Canonical toolchain identity: $($identity.Digest)"

      # ── Restore dependencies ─────────────────────────────────────────

      - name: Cache vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.VCPKG_INSTALLED_DIR }}
            vcpkg/downloads
          key: ${{ runner.os }}-vcpkg-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ steps.toolchain_identity.outputs.digest }}-${{ hashFiles('vcpkg.json', 'vcpkg-tool.json') }}

      - name: Cache pinned Terminal runtime inputs and product
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/TerminalEngine
          # Keep this list equal to the active builder, its direct module imports,
          # the private-runtime overlay, and the notices copied into the product.
          key: ${{ runner.os }}-terminal-runtime-${{ inputs.platform }}-${{ steps.toolchain_identity.outputs.digest }}-${{ hashFiles('Tools/Build-GhosttyTerminalRuntime.ps1', 'Tools/TerminalEngine/GhosttyRuntimeLifecycle.psm1', 'Tools/TerminalEngine/TerminalEngineTextIdentity.psm1', 'Tools/Modules/Build/SanitizedEnvironment.psm1', 'Tools/TerminalEngine/TerminalEngineArchive.psm1', 'Tools/TerminalEngine/TerminalEnginePeIdentity.psm1', 'Tools/TerminalEngine/TerminalRuntimeImportPolicy.psm1', 'Tools/TerminalEngine/TerminalRuntimeExportIdentity.psm1', 'External/TerminalEngine/GhosttyRuntimeLock.v1.json', 'Specs/Terminal/GhosttyRuntimeLock.schema.json', 'Tools/Modules/Testing/ValidationFingerprint.psm1', 'Tools/TerminalEngine/Patches/Ghostty-WindowsPrivateRuntime.patch', 'External/TerminalEngine/Notices/*', 'RuntimeDependencies.props') }}

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $manifestPath = Join-Path $env:GITHUB_WORKSPACE "vcpkg.json"
          if (-not (Test-Path $manifestPath)) {
            throw "vcpkg.json not found at: $manifestPath"
          }

          $baseline = (Get-Content -Path $manifestPath -Raw | ConvertFrom-Json)."builtin-baseline"
          if ([string]::IsNullOrWhiteSpace($baseline)) {
            throw "vcpkg.json builtin-baseline is missing/empty. Set builtin-baseline to a valid vcpkg commit."
          }

          $baseline = $baseline.Trim()
          if ($baseline -notmatch '^[0-9a-fA-F]{40}$') {
            throw "vcpkg.json builtin-baseline is not a 40-character commit SHA: '$baseline'"
          }

          $baseline = $baseline.ToLowerInvariant()
          Write-Host "vcpkg builtin-baseline: $baseline"

          $toolPinPath = Join-Path $env:GITHUB_WORKSPACE "vcpkg-tool.json"
          if (-not (Test-Path $toolPinPath)) {
            throw "vcpkg-tool.json not found at: $toolPinPath"
          }
          $toolPin = Get-Content -Path $toolPinPath -Raw | ConvertFrom-Json
          $toolRepository = ([string]$toolPin.repository).Trim()
          $toolCommit = ([string]$toolPin.commit).Trim().ToLowerInvariant()
          if ([string]::IsNullOrWhiteSpace($toolRepository)) {
            throw "vcpkg-tool.json repository is missing/empty."
          }
          if ($toolCommit -notmatch '^[0-9a-f]{40}$') {
            throw "vcpkg-tool.json commit is not a 40-character commit SHA: '$toolCommit'"
          }
          Write-Host "vcpkg tool commit: $toolCommit"

          # Cache may restore vcpkg\downloads without the vcpkg repo itself.
          $bootstrap = Join-Path $env:GITHUB_WORKSPACE "vcpkg\\bootstrap-vcpkg.bat"
          $gitDir = Join-Path $env:GITHUB_WORKSPACE "vcpkg\\.git"
          if (-not (Test-Path $bootstrap) -or -not (Test-Path $gitDir)) {
            $downloads = Join-Path $env:GITHUB_WORKSPACE "vcpkg\\downloads"
            $downloadsStash = $null

            if (Test-Path $downloads) {
              $downloadsStash = Join-Path $env:RUNNER_TEMP "vcpkg-downloads"
              if (Test-Path $downloadsStash) { Remove-Item $downloadsStash -Recurse -Force }
              Move-Item -Path $downloads -Destination $downloadsStash
            }

            if (Test-Path .\\vcpkg) { Remove-Item .\\vcpkg -Recurse -Force }
            git clone $toolRepository .\\vcpkg
            if ($LASTEXITCODE -ne 0) { throw "git clone vcpkg failed with exit code $LASTEXITCODE" }

            if ($downloadsStash) {
              if (Test-Path $downloads) { Remove-Item $downloads -Recurse -Force }
              Move-Item -Path $downloadsStash -Destination $downloads
            }
          }

          Push-Location .\\vcpkg

          # vcpkg port versioning needs git objects that are typically missing in shallow clones.
          # Unshallow to avoid "failed to unpack tree object" during `vcpkg install`.
          $isShallow = (git rev-parse --is-shallow-repository).Trim()
          if ($isShallow -eq "true") {
            Write-Host "vcpkg repo is shallow; fetching full history..."
            git fetch --prune --unshallow origin
            if ($LASTEXITCODE -ne 0) {
              throw "git fetch --unshallow failed (exit code $LASTEXITCODE)."
            }
          }

          # The executable revision and ports baseline are separate pins; both commits must exist.
          foreach ($requiredCommit in @($toolCommit, $baseline) | Select-Object -Unique) {
            git cat-file -e "$requiredCommit^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              git fetch --depth 1 origin $requiredCommit
              if ($LASTEXITCODE -ne 0) {
                throw "git fetch failed while obtaining pinned vcpkg commit '$requiredCommit'."
              }
              git cat-file -e "$requiredCommit^{commit}" 2>$null
              if ($LASTEXITCODE -ne 0) {
                throw "Pinned vcpkg commit not found after fetch: $requiredCommit"
              }
            }
          }

          # Fail fast with a clear message if the manifest pins an unsupported baseline commit.
          git show "${baseline}:versions/baseline.json" 1>$null 2>$null
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg.json builtin-baseline '$baseline' is invalid: versions/baseline.json missing at that commit. Update vcpkg.json builtin-baseline."
          }

          $toolMetadata = git show "${toolCommit}:scripts/vcpkg-tools.json" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read scripts/vcpkg-tools.json from vcpkg tool commit '$toolCommit'."
          }
          $baselineMetadata = git show "${baseline}:scripts/vcpkg-tools.json" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read scripts/vcpkg-tools.json from vcpkg baseline '$baseline'."
          }
          $toolSchemaVersion = [int]$toolMetadata.'schema-version'
          $baselineSchemaVersion = [int]$baselineMetadata.'schema-version'
          if ($toolSchemaVersion -lt 1 -or $baselineSchemaVersion -lt 1) {
            throw "vcpkg tool metadata schema versions must be positive integers; tool=$toolSchemaVersion baseline=$baselineSchemaVersion."
          }
          if ($toolSchemaVersion -lt $baselineSchemaVersion) {
            throw "vcpkg tool commit '$toolCommit' supports tools schema $toolSchemaVersion, older than baseline '$baseline' schema $baselineSchemaVersion. Update vcpkg-tool.json with the baseline."
          }
          Write-Host "vcpkg tools schema: tool=$toolSchemaVersion baseline=$baselineSchemaVersion"

          git checkout --detach $toolCommit
          if ($LASTEXITCODE -ne 0) { throw "Unable to check out pinned vcpkg tool commit '$toolCommit'." }
          $actualToolCommit = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actualToolCommit -ne $toolCommit) {
            throw "vcpkg tool identity mismatch: expected '$toolCommit', found '$actualToolCommit'."
          }

          Pop-Location

          & $bootstrap
          if ($LASTEXITCODE -ne 0) { throw "bootstrap-vcpkg.bat failed with exit code $LASTEXITCODE" }

      - name: Install dependencies
        shell: pwsh
        run: |
          .\vcpkg\vcpkg.exe install --triplet $env:VCPKG_DEFAULT_TRIPLET --x-manifest-root $env:GITHUB_WORKSPACE --x-install-root $env:VCPKG_INSTALLED_DIR

      - name: Normalize vcpkg install root
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $triplet = $env:VCPKG_DEFAULT_TRIPLET
          $dest = Join-Path $env:VCPKG_INSTALLED_DIR $triplet
          $expected = Join-Path $dest "include\wil\com.h"
          if (Test-Path $expected) {
            Write-Host "$dest already contains WIL headers."
            exit 0
          }

          $candidates = @(
            (Join-Path $env:GITHUB_WORKSPACE "vcpkg\installed\$triplet"),
            (Join-Path $env:GITHUB_WORKSPACE "vcpkg\installed\${triplet}-release")
          )

          $source = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $source) {
            Write-Host "Expected WIL header not found at: $expected" -ForegroundColor Yellow
            Write-Host "Searched install roots:" -ForegroundColor Yellow
            $candidates | ForEach-Object { Write-Host "  - $_" }
            Write-Host "$env:VCPKG_INSTALLED_DIR contents:" -ForegroundColor Yellow
            Get-ChildItem -Path $env:VCPKG_INSTALLED_DIR -ErrorAction SilentlyContinue | Select-Object Name
            Write-Host "vcpkg contents:" -ForegroundColor Yellow
            Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "vcpkg") -ErrorAction SilentlyContinue | Select-Object Name
            throw "vcpkg install root not found to normalize."
          }

          Write-Host "Syncing $source -> $dest"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          & robocopy.exe $source $dest /E /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) {
            throw "robocopy failed with exit code $LASTEXITCODE"
          }

          if (-not (Test-Path $expected)) {
            throw "Expected WIL header not found after sync: $expected"
          }

      # ── Build ────────────────────────────────────────────────────────

      - name: Build solution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # CI runners don't always include Visual Studio's vcpkg MSBuild integration component.
          # Provide vcpkg include/lib paths explicitly so compilation and linking can resolve dependencies.
          $triplet = $env:VCPKG_DEFAULT_TRIPLET
          $vcpkgRoot = Join-Path $env:VCPKG_INSTALLED_DIR $triplet
          $incRoot = Join-Path $vcpkgRoot "include"
          $isDebugConfiguration = "${{ inputs.configuration }}" -like "*Debug*"
          $vcpkgConfiguration = if ($isDebugConfiguration) { "Debug" } else { "Release" }
          $libRoot = Join-Path $vcpkgRoot $(if ($isDebugConfiguration) { "debug\lib" } else { "lib" })
          $binRoot = Join-Path $vcpkgRoot $(if ($isDebugConfiguration) { "debug\bin" } else { "bin" })

          if (-not (Test-Path $incRoot)) { throw "vcpkg include root not found: $incRoot" }
          if (-not (Test-Path $libRoot)) { throw "vcpkg lib root not found: $libRoot" }

          # Import the pinned checkout's MSBuild integration for this build only. The targets add
          # the installed libraries themselves (not merely /LIBPATH), without mutating user-wide
          # MSBuild state.
          $vcpkgMsbuildRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg\scripts\buildsystems\msbuild"
          $vcpkgProps = Join-Path $vcpkgMsbuildRoot "vcpkg.props"
          $vcpkgTargets = Join-Path $vcpkgMsbuildRoot "vcpkg.targets"
          if (-not (Test-Path $vcpkgProps)) { throw "Pinned vcpkg MSBuild props not found: $vcpkgProps" }
          if (-not (Test-Path $vcpkgTargets)) { throw "Pinned vcpkg MSBuild targets not found: $vcpkgTargets" }

          $env:ForceImportBeforeCppTargets = $vcpkgProps
          $env:ForceImportAfterCppTargets = $vcpkgTargets
          $env:VcpkgRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
          $env:VcpkgConfiguration = $vcpkgConfiguration
          $env:VcpkgManifestInstall = "false"
          # BuildEvidence consumes the vcpkg tlog as an output declaration.
          # The built-in copier records source paths there; the pinned
          # PowerShell copier records the copied destination paths.
          $env:VcpkgXUseBuiltInApplocalDeps = "false"
          $env:VCPkgLocalAppDataDisabled = "true"

          $env:CL = "/I`"$incRoot`" $env:CL"

          $linkPaths = @($libRoot)
          $libManualRoot = Join-Path $libRoot "manual-link"
          if (Test-Path $libManualRoot) { $linkPaths += $libManualRoot }
          $linkFlags = ($linkPaths | ForEach-Object { "/LIBPATH:`"$_`"" }) -join ' '
          $env:LINK = "$linkFlags $env:LINK"

          if (Test-Path $binRoot) { $env:Path = "$binRoot;$env:Path" }

          $buildScript = Join-Path $env:GITHUB_WORKSPACE "build.ps1"
          if (-not (Test-Path $buildScript)) { throw "build.ps1 not found at: $buildScript" }

          $buildArgs = @{
            Configuration = "${{ inputs.configuration }}"
            Platform      = "${{ inputs.platform }}"
          }
          if ("${{ inputs.build_number }}" -ne "") {
            $buildArgs.BuildNumber = "${{ inputs.build_number }}"
          }
          if ("${{ inputs.official_release }}" -eq "true") {
            $buildArgs.OfficialRelease = $true
          }

          & $buildScript @buildArgs

      - name: Create portable same-workflow build attestation
        id: portable_attestation
        if: ${{ inputs.upload_build_output }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE ".build\${{ inputs.platform }}\${{ inputs.configuration }}"
          $module = Join-Path $env:GITHUB_WORKSPACE "Tools\Modules\Build\BuildEvidence.psm1"
          $receiptSchema = Join-Path $env:GITHUB_WORKSPACE "Specs\Build\BuildReceipt.schema.json"
          $portableSchema = Join-Path $env:GITHUB_WORKSPACE "Specs\Build\PortableBuildAttestation.schema.json"
          $toolchainSchema = Join-Path $env:GITHUB_WORKSPACE "Specs\Build\ToolchainIdentity.schema.json"
          Import-Module $module -Force
          $receipt = Read-RSBuildReceipt -BuildOutputDir $outputDirectory -SchemaPath $receiptSchema
          if ($null -eq $receipt -or $receipt.target -ne 'solution') {
            throw "A full-solution build receipt is required before portable publication."
          }
          $attestation = New-RSPortableBuildAttestation -Receipt $receipt `
            -RepoRoot $env:GITHUB_WORKSPACE -BuildOutputDir $outputDirectory `
            -ToolchainSchemaPath $toolchainSchema `
            -ProducerRepository $env:GITHUB_REPOSITORY -ProducerWorkflow $env:GITHUB_WORKFLOW `
            -ProducerRunId $env:GITHUB_RUN_ID -ProducerRunAttempt ([int]$env:GITHUB_RUN_ATTEMPT) `
            -ProducerJob $env:GITHUB_JOB
          $payloadPath = Publish-RSPortableBuildPayload `
            -RepoRoot $env:GITHUB_WORKSPACE -BuildOutputDir $outputDirectory `
            -Receipt $receipt -Attestation $attestation -PortableSchemaPath $portableSchema
          "attestation_id=$($attestation.attestation_id)" >> $env:GITHUB_OUTPUT
          "toolchain_identity_digest=$($attestation.toolchain_identity_digest)" >> $env:GITHUB_OUTPUT
          "payload_path=$payloadPath" >> $env:GITHUB_OUTPUT
          Write-Host "Portable build payload: $payloadPath"

      - name: Run ASan plugin contracts
        if: ${{ inputs.run_asan_plugin_contracts }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ inputs.configuration }}" -ne "ASan Debug" -or "${{ inputs.platform }}" -ne "x64") {
            throw "run_asan_plugin_contracts requires the x64 ASan Debug configuration."
          }
          $testExe = ".\.build\x64\ASan Debug\PluginContractTests.exe"
          $oldNativeErrorPreference = $PSNativeCommandUseErrorActionPreference
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            $probeOutput = @(& $testExe --asan-seed-heap-overflow 2>&1)
            $probeExitCode = $LASTEXITCODE
          } finally {
            $PSNativeCommandUseErrorActionPreference = $oldNativeErrorPreference
          }
          $probeOutput | Out-Host
          if ($probeExitCode -eq 0) { throw "The seeded heap overflow was not rejected by AddressSanitizer." }
          if (($probeOutput -join "`n") -notmatch "AddressSanitizer") {
            throw "The seeded heap overflow failed without an AddressSanitizer diagnostic."
          }

          & $testExe
          if ($LASTEXITCODE -ne 0) { throw "ASan PluginContractTests failed with exit code $LASTEXITCODE." }

      - name: Upload build output
        if: ${{ inputs.upload_build_output }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output-${{ inputs.platform }}
          path: ${{ steps.portable_attestation.outputs.payload_path }}/
          retention-days: 1
