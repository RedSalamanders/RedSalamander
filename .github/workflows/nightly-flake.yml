name: Nightly Flake Convergence

"on":
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest-build:
    uses: ./.github/workflows/build-reusable.yml
    with:
      configuration: Debug
      platform: x64
      upload_build_output: true

  nightly-shuffle-repeat:
    runs-on: windows-latest
    needs: selftest-build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select test-data root
        id: test-root
        shell: pwsh
        run: |
          $root = Join-Path ([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)) 'RedSalamander.Perf'
          "REDSALAMANDER_TEST_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "path=$root" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output-x64
          path: .build/x64/Debug/

      - name: Stage Themes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path .\Themes) {
            $dest = Join-Path $env:GITHUB_WORKSPACE ".build\x64\Debug\Themes"
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            Copy-Item -Path .\Themes\* -Destination $dest -Recurse -Force
          }

      - name: Verify and rebind portable build attestation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module .\Tools\Modules\Build\BuildEvidence.psm1 -Force
          Import-RSPortableBuildAttestation `
            -RepoRoot $env:GITHUB_WORKSPACE `
            -BuildOutputDir (Join-Path $env:GITHUB_WORKSPACE '.build\x64\Debug') `
            -PortableSchemaPath .\Specs\Build\PortableBuildAttestation.schema.json `
            -BuildReceiptSchemaPath .\Specs\Build\BuildReceipt.schema.json `
            -ToolchainSchemaPath .\Specs\Build\ToolchainIdentity.schema.json `
            -ExpectedRepository $env:GITHUB_REPOSITORY `
            -ExpectedWorkflow $env:GITHUB_WORKFLOW `
            -ExpectedRunId $env:GITHUB_RUN_ID `
            -ExpectedRunAttempt ([int]$env:GITHUB_RUN_ATTEMPT) `
            -ExpectedProducerJob 'build' `
            -ExpectedAttestationId '${{ needs.selftest-build.outputs.portable_attestation_id }}' `
            -ExpectedToolchainIdentityDigest '${{ needs.selftest-build.outputs.portable_toolchain_identity_digest }}' `
            -ExpectedSourceCommit $env:GITHUB_SHA `
            -ExpectedPlatform x64 `
            -ExpectedConfiguration Debug | Out-Null

      - name: Run nightly shuffle repeat lane
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $seed = if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_RUN_ID)) {
            $env:GITHUB_RUN_ID
          } else {
            [string]([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())
          }
          Write-Host "Nightly self-test shuffle seed: $seed"
          .\Tools\Run-AllTests.ps1 -Suite All -ValidationMode Fresh -SkipBuild -TimeoutMultiplier 2.0 -SelfTestRepeat 5 -SelfTestShuffleSeed $seed -ClassifyFailures -AllowExternalTestRoot
        timeout-minutes: 210

      - name: Upload nightly shuffle artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selftest-artifacts-nightly-shuffle
          path: ${{ steps.test-root.outputs.path }}\
          retention-days: 14
