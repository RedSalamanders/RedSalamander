<title id="title">Explorer — treemap with linked analysis proposal</title><desc id="desc">Illustrative Space Viewer design. A large treemap is linked to a ranked list and persistent selected-folder inspector. All numbers are invented logical-size fixture values; three unreadable folders are explicitly unknown.</desc>
